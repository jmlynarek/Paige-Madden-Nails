// The gift-card side pane. Everything about one gift in one place — crucially the
// recipient's mailing address, which otherwise disappears once a pending purchase
// is issued into the ledger. Same visual shell as the order drawer.
function renderGiftDrawer(host){
  var id = state.giftDrawerId;
  var c = (state.giftCards||[]).find(function(x){return x.id===id;});
  if(!c){ host.innerHTML=''; return; }

  var isCard  = c.delivery_method==='card';
  var isEmail = c.delivery_method==='email';
  var total   = Number(c.amount||0) + Number(c.ship_fee||0);
  var type    = gcType(c);
  var addr    = giftAddr(c);
  var title   = c.recipient_name || c.buyer_name || 'Gift card';
  var ref     = c.purchase_ref || c.code || '—';
  // A mailed card spawns a $0 ship order on issue — link to it if it exists.
  var shipOrder = isCard ? (state.orders||[]).find(function(o){return o.gift_shipment_id===c.id;}) : null;

  function kv(k,v){ return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
  var secs = '';

  // ---- Overview ----
  secs += '<div class="dr-sec-t" style="margin-bottom:8px">Overview</div>'+
    '<div class="dr-card">'+
      kv('Amount', money(c.amount))+
      (Number(c.ship_fee)>0 ? kv('Shipping', money(c.ship_fee)) : '')+
      kv('<b>'+(c.status==='pending'?'To collect':'Total')+'</b>', '<b>'+money(total)+'</b>')+
      kv('Type', gcTypeChip(c))+
      kv('Status', gcPill(c.status))+
    '</div>';

  // ---- Deliver to ----
  if(isCard){
    secs += '<div class="dr-sec-t" style="margin:16px 0 8px">Mail the card to</div>'+
      '<div class="dr-card">'+
        kv('Recipient', esc(c.recipient_name||'—'))+
        kv('Address', addr ? esc(addr) : '<span class="muted">No address on file</span>')+
      '</div>'+
      (addr ? '<button class="btn btn-line" data-copy-text="'+esc((c.recipient_name?c.recipient_name+'\n':'')+addr.replace(/, /g,'\n'))+'" style="margin-top:8px;width:100%">Copy mailing address</button>' : '');
  } else if(isEmail){
    secs += '<div class="dr-sec-t" style="margin:16px 0 8px">Email the recipient</div>'+
      '<div class="dr-card">'+
        kv('Recipient', esc(c.recipient_name||'—'))+
        kv('Email', c.recipient_email?'<a href="mailto:'+esc(c.recipient_email)+'">'+esc(c.recipient_email)+'</a>':'<span class="muted">—</span>')+
      '</div>';
  }

  // ---- Message ----
  if(c.gift_message){
    secs += '<div class="dr-sec-t" style="margin:16px 0 8px">Gift message</div>'+
      '<div class="notes-box">'+esc(c.gift_message)+'</div>';
  }

  // ---- From (buyer) ----
  secs += '<div class="dr-sec-t" style="margin:16px 0 8px">From</div>'+
    '<div class="dr-card">'+
      kv('Buyer', esc(c.buyer_name||'—'))+
      kv('Email', c.buyer_email?'<a href="mailto:'+esc(c.buyer_email)+'">'+esc(c.buyer_email)+'</a>':'<span class="muted">—</span>')+
    '</div>';

  // ---- The code (only exists once issued) ----
  if(c.code){
    secs += '<div class="dr-sec-t" style="margin:16px 0 8px">Gift code</div>'+
      '<div class="dr-card"><div class="kv"><span class="k">Code</span>'+
        '<span class="v"><span class="oid" style="letter-spacing:1px">'+esc(c.code)+'</span></span></div></div>'+
      '<button class="btn btn-line" data-copy-text="'+esc(c.code)+'" style="margin-top:8px;width:100%">Copy code</button>';
  } else if(c.status==='pending'){
    secs += '<div class="dr-sec-t" style="margin:16px 0 8px">Gift code</div>'+
      '<div class="muted" style="font-size:12.5px">Hidden until you confirm payment and <b>Issue &amp; send</b> — that releases the code.</div>';
  }

  // ---- Timeline ----
  secs += '<div class="dr-sec-t" style="margin:16px 0 8px">Timeline</div>'+
    '<div class="dr-card">'+
      kv('Ordered', fmtDay(c.created_at))+
      (c.issued_at ? kv('Issued', fmtDay(c.issued_at)) : '')+
      (c.redeemed_at ? kv('Redeemed', fmtDay(c.redeemed_at)) : '')+
    '</div>';

  // ---- Linked shipping order ----
  if(shipOrder){
    secs += '<div class="dr-sec-t" style="margin:16px 0 8px">Shipping order</div>'+
      '<button class="btn btn-line" data-open-order="'+shipOrder.id+'" style="width:100%">Open '+shortId(shipOrder)+' in Orders →</button>';
  }

  // ---- Footer actions by status ----
  var foot = '<button class="btn btn-line" data-close>Close</button>';
  if(c.status==='pending'){
    foot = '<button class="btn" data-gc-issue="'+c.id+'" style="flex:1">Issue &amp; send →</button>'+
      '<button class="btn btn-danger" data-gc-void="'+c.id+'">Void</button>';
  } else if(c.status==='active'){
    foot = '<button class="btn btn-line" data-gc-redeem="'+c.id+'" style="flex:1">Mark redeemed</button>'+
      '<button class="btn btn-danger" data-gc-void="'+c.id+'">Void</button>';
  }

  host.innerHTML =
    '<div class="scrim show" data-close></div>'+
    '<aside class="drawer show">'+
      '<div class="dr-head">'+avatar(title)+
        '<div><div class="dr-title">'+esc(title)+'</div><div class="dr-meta">'+esc(ref)+' · '+esc(type.label)+'</div></div>'+
        '<button class="icon-btn dr-x" data-close>'+I.x+'</button>'+
      '</div>'+
      '<div class="dr-body"><div style="padding:16px">'+secs+'</div></div>'+
      '<div class="dr-foot">'+foot+'</div>'+
    '</aside>';

  host.querySelectorAll('[data-close]').forEach(function(b){ b.onclick=closeDrawer; });
  host.querySelectorAll('[data-gc-issue]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); issueGiftCard(b.getAttribute('data-gc-issue')); }; });
  host.querySelectorAll('[data-gc-void]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); voidGiftCard(b.getAttribute('data-gc-void')); }; });
  host.querySelectorAll('[data-gc-redeem]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); redeemGiftCard(b.getAttribute('data-gc-redeem')); }; });
  host.querySelectorAll('[data-open-order]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); openOrder(b.getAttribute('data-open-order')); }; });
  host.querySelectorAll('[data-copy-text]').forEach(function(b){ b.onclick=function(){
    var v=b.getAttribute('data-copy-text'); if(navigator.clipboard){ navigator.clipboard.writeText(v).then(function(){ toast('Copied','','ok'); }); }
  }; });
}

function loadPhotos(id){
  sb.from('order_photos').select('*').eq('order_id', id).order('position').then(function(r){
    var rows=r.data||[]; if(!rows.length){ state.photos[id]=[]; renderDrawer(); return; }
    Promise.all(rows.map(function(p){
      return sb.storage.from('inspiration').createSignedUrl(p.storage_path, 3600).then(function(s){ return s.data?s.data.signedUrl:null; }).catch(function(){return null;});
    })).then(function(urls){ state.photos[id]=urls; renderDrawer(); });
  });
}

function renderDrawer(){
  var host = $('#drawerHost'); if(!host) return;
  if(state.giftDrawerId){ return renderGiftDrawer(host); }
  var id = state.drawerId;
  if(!id){ host.innerHTML=''; return; }
  var o = state.orders.find(function(x){return x.id===id;});
  if(!o){ host.innerHTML=''; return; }

  var sizes = o.sizes||{};
  var sizeCells = ['Thumb','Index','Middle','Ring','Pinky'].map(function(f){
    return '<div class="size"><div class="fn">'+f+'</div><div class="sv">'+esc(sizes[f]!=null&&sizes[f]!==''?sizes[f]:'–')+'</div></div>';
  }).join('');

  var contact = '';
  if(o.email) contact += '<div class="kv"><span class="k">'+I.mail+'</span><span class="v"><a href="mailto:'+esc(o.email)+'">'+esc(o.email)+'</a></span></div>';
  if(o.phone) contact += '<div class="kv"><span class="k">'+I.phone+'</span><span class="v"><a href="tel:'+esc(o.phone)+'">'+esc(o.phone)+'</a></span></div>';

  var isShip = o.fulfillment==='shipping';
  var isGift = !!o.gift_shipment_id;   // a physical gift card Paige mails out

  // ---- shipping is split into two accordions: address + label ----
  var shipAddrHtml='', shipAddrSub='', shipLabelHtml='', shipLabelSub='', shipLabelBadge='';
  if(isShip){
    var addr=[o.address_line1, o.address_line2, [o.city,o.region].filter(Boolean).join(', '), o.postal_code].filter(Boolean).join(' · ');
    shipAddrSub =esc([o.city,o.region].filter(Boolean).join(', ') || (o.ship_to_name||o.customer_name));
    shipAddrHtml = '<div class="dr-card"><div class="kv"><span class="k">Method</span><span class="v">Shipping'+(o.ship_speed?' · '+esc(o.ship_speed):'')+'</span></div>'+
      '<div class="kv"><span class="k">Ship to</span><span class="v">'+esc(o.ship_to_name||o.customer_name)+'</span></div>'+
      (addr?'<div class="kv"><span class="k">Address</span><span class="v">'+esc(addr)+'</span></div>':'')+'</div>';

    if(o.label_url){
      // Label already bought — tracking + reprint.
      shipLabelBadge = accBadge('Label bought','ok',true);
      shipLabelSub = (o.service_level?esc(o.service_level)+' · ':'')+money(o.shipping_cost);
      shipLabelHtml = '<div class="dr-card">'+
        '<div class="kv"><span class="k">Carrier</span><span class="v">'+esc(o.carrier||'USPS')+(o.service_level?' · '+esc(o.service_level):'')+'</span></div>'+
        '<div class="kv"><span class="k">Tracking</span><span class="v">'+(o.tracking_url?'<a href="'+esc(o.tracking_url)+'" target="_blank" rel="noopener">'+esc(o.tracking_number||'Track')+'</a>':esc(o.tracking_number||'—'))+'</span></div>'+
        '<div class="kv"><span class="k">Postage</span><span class="v">'+money(o.shipping_cost)+'</span></div>'+
        (o.shipped_at?'<div class="kv"><span class="k">Label bought</span><span class="v">'+fmtDate(o.shipped_at)+'</span></div>':'')+
        '</div>'+
        '<a class="btn" href="'+esc(o.label_url)+'" target="_blank" rel="noopener" style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none">'+I.box+'Print label</a>';
    } else {
      // No label yet — parcel inputs + buy button.
      shipLabelBadge = accBadge('Not bought','warn');
      shipLabelSub = '';
      var pf = function(pid,label,val,step,min){ return '<label style="display:flex;flex-direction:column;gap:4px"><span class="muted" style="font-size:11.5px">'+label+'</span><input class="input" id="'+pid+'" type="number" min="'+min+'" step="'+step+'" value="'+val+'"></label>'; };
      shipLabelHtml = '<div class="muted" style="font-size:12px;margin:-2px 0 10px">Buys the cheapest USPS rate (Standard).</div>'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
          pf('pWeight','Weight (oz)','3','0.1','0.1')+pf('pLen','Length (in)','6','0.5','1')+
          pf('pWid','Width (in)','4','0.5','1')+pf('pHt','Height (in)','1','0.5','0.5')+
        '</div>'+
        '<button class="btn" id="buyLabel" style="margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px">'+I.truck+'Buy &amp; print label</button>';
    }
  }

  var ph = state.photos[id];
  var photosHtml='';
  if(ph===undefined){ photosHtml='<div class="muted" style="font-size:12.5px">Loading photos…</div>'; }
  else if(ph.length){ photosHtml='<div class="photos">'+ph.map(function(u){return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="inspiration"></a>':'<div class="ph-ph">no preview</div>';}).join('')+'</div>'; }
  else { photosHtml='<div class="muted" style="font-size:12.5px">No inspiration photos.</div>'; }

  var flow = flowFor(o);
  var curIdx = flow.indexOf(o.status);
  var steps = flow.map(function(s,i){
    var cls = o.status===s?'cur':(o.status==='cancelled'?'':(i<curIdx?'done':''));
    return '<button class="step '+cls+'" data-status="'+s+'">'+STATUS[s].label+'</button>';
  }).join('');

  var tierName = (state.tiers.find(function(x){return x.id===o.design_tier;})||{}).name||o.design_tier;

  // ---- accordion sections (display order). open:true => expanded by default ----
  var sections = [];
  sections.push({ id:'sec-status', icon:I.flag, label:'Status', open:true, sub:statusPill(o.status), html:
    (o.status==='unpaid'?
      // Unpaid is a side-flag: skip the linear stepper, offer the "paid" path + a resend.
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px">'+statusPill('unpaid')+'<span class="muted" style="font-size:12.5px">Waiting on payment — reminder sent.</span></div>'+
      '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">'+
        '<button class="btn" data-status="in_progress" style="width:auto;display:inline-flex;padding:8px 14px;font-size:13px">Payment received → In Progress</button>'+
        '<button class="btn-chip warn" data-unpaid-email="'+id+'">Send reminder</button>'+
      '</div>'
    :
    '<div class="stepper">'+steps+'</div>'+
    (o.status==='cancelled'?'<div style="margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px">'+statusPill('cancelled')+'<button class="btn-chip" data-status="new">Reopen</button><button class="btn-chip" data-cancel-email="'+id+'">Send cancellation email</button></div>':''
    )) });
  if(isShip){
    sections.push({ id:'sec-ship', icon:I.pin, label:'Shipping', open:false, sub:shipAddrSub, html:shipAddrHtml });
    sections.push({ id:'sec-label', icon:I.tag, label:'Shipping label', open:false, badge:shipLabelBadge, sub:shipLabelSub, html:shipLabelHtml });
  } else {
    // Pickup order — but let the admin switch it to shipping (customer changed
    // their mind). Collecting an address flips fulfillment='shipping', which
    // makes renderDrawer show the Shipping + buy-label sections next pass.
    var swf = function(pid,label,val,ph){ return '<label style="display:flex;flex-direction:column;gap:4px"><span class="muted" style="font-size:11.5px">'+label+'</span><input class="input" id="'+pid+'" type="text" value="'+esc(val||'')+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'></label>'; };
    // State picker — all US states by USPS abbreviation, default Michigan (Paige's usual ship-to).
    var US_STATES='AK AL AR AZ CA CO CT DC DE FL GA HI IA ID IL IN KS KY LA MA MD ME MI MN MO MS MT NC ND NE NH NJ NM NV NY OH OK OR PA RI SC SD TN TX UT VA VT WA WI WV WY'.split(' ');
    var swSel = function(pid,label,val){ var cur=String(val||'MI').toUpperCase();
      return '<label style="display:flex;flex-direction:column;gap:4px"><span class="muted" style="font-size:11.5px">'+label+'</span><select class="input" id="'+pid+'">'+
        US_STATES.map(function(s){ return '<option value="'+s+'"'+(s===cur?' selected':'')+'>'+s+'</option>'; }).join('')+'</select></label>'; };
    // Restore any unsaved address from state so a mid-edit re-render (photos, realtime) can't wipe it.
    var d = (state.shipDraft && state.shipDraft.id===id) ? state.shipDraft : null;
    var dOpen = !!(d && d.open);
    var pickupHtml =
      '<div class="dr-card"><div class="kv"><span class="k">Method</span><span class="v">Local pickup</span></div></div>'+
      '<div class="muted" style="font-size:12px;margin:10px 0 8px">Customer wants it shipped instead? Add an address to switch this order to shipping and buy a label.</div>'+
      '<button class="btn btn-line" id="toShip" style="width:100%;'+(dOpen?'display:none':'display:flex')+';align-items:center;justify-content:center;gap:6px">'+I.truck+'Switch to shipping…</button>'+
      '<div id="shipForm" style="display:'+(dOpen?'block':'none')+';margin-top:12px">'+
        '<div style="display:grid;gap:8px">'+
          swf('swName','Recipient', d ? d.name : o.customer_name)+
          swf('swL1','Street address', d?d.l1:'', '123 Main St')+
          swf('swL2','Apt / unit (optional)', d?d.l2:'')+
          '<div style="display:grid;grid-template-columns:1.6fr .7fr .9fr;gap:8px">'+
            swf('swCity','City', d?d.city:'')+swSel('swRegion','State', d ? d.region : 'MI')+swf('swZip','ZIP', d?d.zip:'')+
          '</div>'+
        '</div>'+
        '<button class="btn" id="doSwitch" style="margin-top:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px">'+I.truck+'Save &amp; switch to shipping</button>'+
      '</div>';
    sections.push({ id:'sec-ship', icon:I.bag, label:'Pickup', open:dOpen, sub:'Local pickup', html:pickupHtml });
  }
  var gift = Number(o.gift_credit||0);
  var due = Math.max(0, orderValue(o) - gift);
  if(isGift){
    // A shipment of an already-paid gift card — nothing to collect.
    sections.push({ id:'sec-gift', icon:I.gift, label:'Gift card', open:false, sub:'Mail the card',
      html:'<div class="dr-card"><div class="kv"><span class="k">Task</span><span class="v">Write the code on a card &amp; mail it</span></div>'+
        '<div class="kv"><span class="k">Mail to</span><span class="v">'+esc(o.ship_to_name||o.customer_name||'recipient')+'</span></div>'+
        '<div class="kv"><span class="k">Paid</span><span class="v" style="color:#0E7E5B">Already paid — nothing to collect</span></div></div>'+
        (o.notes?'<div class="notes-box" style="margin-top:10px">'+esc(o.notes)+'</div>':'') });
  } else {
    var collected = !!o.payment_collected, nothingDue = due<=0;
    var payBadge = nothingDue ? accBadge('Nothing due','ok',true) : (collected ? accBadge('Collected','ok',true) : accBadge('Not collected','warn'));
    var payToggle = nothingDue ? '' : (collected
      ? '<div style="margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px">'+(o.paid_at?'<span class="muted" style="font-size:12.5px">Collected '+fmtDate(o.paid_at)+'</span>':'<span class="muted" style="font-size:12.5px">Payment collected.</span>')+'<button class="btn-chip" data-pay-collected="'+id+'" data-to="0">Mark not collected</button></div>'
      : '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">'+
          '<button class="btn btn-pay" data-pay-collected="'+id+'" data-to="1" style="width:auto;flex:1;min-width:190px;display:inline-flex;align-items:center;justify-content:center;gap:6px">'+I.dollar+'Mark payment collected</button>'+
          (o.email?'<button class="btn btn-line" data-unpaid-email="'+id+'" style="width:auto;flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px">'+I.mail+'Send reminder email</button>':'')+
        '</div>');
    sections.push({ id:'sec-pay', icon:I.cart, label:'Payment', open:state.drawerFocus==='sec-pay', badge:payBadge,
      sub: gift>0 ? (due>0 ? money(due)+' due · '+money(gift)+' prepaid' : 'Prepaid — nothing due') : money(orderValue(o))+' to collect', html:
      '<div class="dr-card">'+
        (o.gift_card_id?'<div class="kv"><span class="k"><span class="chip" style="color:#B46869">'+I.gift+'Prepaid</span></span><span class="v muted">gift card</span></div>':'')+
        '<div class="kv"><span class="k">Set price</span><span class="v">'+money(orderSetPrice(o))+'</span></div>'+
        (Number(o.ship_fee)>0?'<div class="kv"><span class="k">Shipping</span><span class="v">'+money(o.ship_fee)+'</span></div>':'')+
        (Number(o.rush_fee)>0?'<div class="kv"><span class="k">Rush</span><span class="v">'+money(o.rush_fee)+'</span></div>':'')+
        (gift>0?'<div class="kv"><span class="k">Gift credit</span><span class="v" style="color:#0E7E5B">− '+money(gift)+'</span></div>':'')+
        '<div class="kv"><span class="k"><b>'+(gift>0?'Still to collect':'Total to collect')+'</b></span><span class="v"><b>'+money(due)+'</b></span></div>'+
      '</div>'+payToggle });
    sections.push({ id:'sec-design', icon:I.palette, label:'Design', open:false, sub:esc((o.nail_shape||'—')+' · '+tierName), html:
      '<div class="dr-card"><div class="kv"><span class="k">Shape</span><span class="v">'+esc(o.nail_shape||'—')+'</span></div><div class="kv"><span class="k">Tier</span><span class="v">'+esc(tierName)+'</span></div></div>'+
      '<div style="margin-top:12px"><div class="dr-sec-t" style="margin-bottom:8px">Sizes</div><div class="sizes">'+sizeCells+'</div></div>' });
  }
  if(o.notes && !isGift){ sections.push({ id:'sec-notes', icon:I.note, label:'Notes', open:false, sub:'', html:'<div class="notes-box">'+esc(o.notes)+'</div>' }); }
  sections.push({ id:'sec-photos', icon:I.image, label:'Photos', open:false, sub:(ph===undefined?'':(ph.length?ph.length+' photo'+(ph.length>1?'s':''):'None')), html:photosHtml });
  if(contact){ sections.push({ id:'sec-contact', icon:I.user, label:'Contact', open:false, sub:esc(o.email||o.phone||''), html:'<div class="dr-card">'+contact+'</div>' }); }

  function accHtml(s){
    return '<div class="acc'+(s.open?' open':'')+'" id="'+s.id+'">'+
      '<button class="acc-h" type="button" data-acc="'+s.id+'">'+
        '<span class="acc-l"><span class="acc-ic">'+(s.icon||'')+'</span><span class="acc-t">'+s.label+'</span></span>'+
        '<span class="acc-r">'+(s.badge||'')+(s.sub?'<span class="acc-sub">'+s.sub+'</span>':'')+'<span class="acc-chev">'+I.chev+'</span></span>'+
      '</button>'+
      '<div class="acc-b"><div class="acc-b-in"><div class="acc-pad">'+s.html+'</div></div></div>'+
    '</div>';
  }

  var navHtml = '<div class="dr-nav">'+sections.map(function(s){ return '<button type="button" data-jump="'+s.id+'">'+(s.icon||'')+s.label+'</button>'; }).join('')+'</div>';
  var bodyHtml = sections.map(accHtml).join('');

  host.innerHTML =
    '<div class="scrim show" data-close></div>'+
    '<aside class="drawer show">'+
      '<div class="dr-head">'+avatar(o.customer_name)+
        '<div class="dr-head-main"><div class="dr-ordno">'+shortId(o)+'</div><div class="dr-title">'+esc(o.customer_name)+'</div><div class="dr-meta">'+fmtDate(o.created_at)+(o.source==='sample'?' · <b style="color:var(--rose)">sample</b>':'')+'</div></div>'+
        '<button class="icon-btn dr-x" data-close>'+I.x+'</button>'+
      '</div>'+
      '<div class="dr-body">'+navHtml+bodyHtml+'</div>'+
      '<div class="dr-foot">'+
        '<button class="btn btn-line" data-close>Close</button>'+
        (o.status!=='cancelled'?'<button class="btn btn-danger" data-cancel-order="'+o.id+'" title="Cancel order" aria-label="Cancel order">'+I.trash+'Cancel order</button>':'')+
      '</div>'+
    '</aside>';

  // Wire the drawer's own controls here so it works whether or not wire() runs after.
  host.querySelectorAll('[data-acc]').forEach(function(b){
    b.onclick = function(){ var sec=host.querySelector('#'+b.getAttribute('data-acc')); if(sec) sec.classList.toggle('open'); };
  });
  host.querySelectorAll('[data-jump]').forEach(function(b){
    b.onclick = function(){
      var body=host.querySelector('.dr-body'), sec=host.querySelector('#'+b.getAttribute('data-jump'));
      if(!body||!sec) return;
      sec.classList.add('open'); // expand the target so its content is visible
      var top = sec.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop - 58; // clear the sticky nav
      body.scrollTo({ top: Math.max(0, top), behavior:'smooth' });
    };
  });
  host.querySelectorAll('[data-close]').forEach(function(b){ b.onclick = closeDrawer; });
  host.querySelectorAll('[data-status]').forEach(function(b){ b.onclick = function(e){ e.stopPropagation(); setStatus(id, b.getAttribute('data-status')); }; });

  host.querySelectorAll('[data-unpaid-email]').forEach(function(b){ b.onclick = function(e){ e.stopPropagation(); resendUnpaidEmail(b.getAttribute('data-unpaid-email')); }; });
  host.querySelectorAll('[data-pay-collected]').forEach(function(b){ b.onclick = function(e){ e.stopPropagation(); setPaymentCollected(b.getAttribute('data-pay-collected'), b.getAttribute('data-to')==='1'); }; });
  host.querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(e){ e.stopPropagation(); delOrder(b.getAttribute('data-del')); }; });
  host.querySelectorAll('[data-cancel-order]').forEach(function(b){ b.onclick = function(e){ e.stopPropagation(); cancelOrder(b.getAttribute('data-cancel-order')); }; });
  var buyBtn = $('#buyLabel');
  if(buyBtn){ buyBtn.onclick = function(){ buyLabel(id); }; }
  var toShip = $('#toShip');
  if(toShip){ toShip.onclick = function(){
    var f=$('#shipForm'); if(f) f.style.display='block';
    toShip.style.display='none';
    var sec=host.querySelector('#sec-ship'); if(sec) sec.classList.add('open');
    // Seed the draft so the open form + typed values survive any re-render.
    if(!state.shipDraft || state.shipDraft.id!==id) state.shipDraft={id:id, name:(o.customer_name||''), l1:'',l2:'',city:'',region:'MI',zip:''};
    state.shipDraft.open=true;
    var l1=$('#swL1'); if(l1) l1.focus();
  }; }
  // Mirror each keystroke into state.shipDraft (no re-render → focus is never lost),
  // so switchToShipping and any rebuild read what was actually typed.
  var draftMap={swName:'name', swL1:'l1', swL2:'l2', swCity:'city', swRegion:'region', swZip:'zip'};
  Object.keys(draftMap).forEach(function(fid){
    var el=$('#'+fid); if(!el) return;
    var cap=function(){
      if(!state.shipDraft || state.shipDraft.id!==id) state.shipDraft={id:id, name:'',l1:'',l2:'',city:'',region:'MI',zip:''};
      state.shipDraft[draftMap[fid]]=el.value; state.shipDraft.open=true;
    };
    el.oninput=cap; el.onchange=cap; // onchange covers the State <select>
  });
  var doSwitch = $('#doSwitch');
  if(doSwitch){ doSwitch.onclick = function(){ switchToShipping(id); }; }
}

/* ───────────────────────── shipping labels ───────────────────────── */
function buyLabel(id){
  var o = state.orders.find(function(x){return x.id===id;});
  if(!o) return;
  var num = function(sel, d){ var n=$(sel); var v=n?Number(n.value):NaN; return (isFinite(v)&&v>0)?v:d; };
  var parcel = { weight:num('#pWeight',3), length:num('#pLen',6), width:num('#pWid',4), height:num('#pHt',1) };
  if(!confirm('Buy a USPS label (cheapest rate) for '+(o.ship_to_name||o.customer_name)+'?\n\nThis charges your Shippo account for the postage.')) return;

  var btn = $('#buyLabel');
  var reset = function(){ if(btn){ btn.disabled=false; btn.innerHTML=I.truck+'Buy &amp; print label'; } };
  if(btn){ btn.disabled=true; btn.innerHTML='Buying label…'; }

  sb.functions.invoke('buy-shipping-label', { body:{ order_id:id, parcel:parcel } }).then(function(r){
    if(r.error){
      var ctx = r.error.context;
      if(ctx && typeof ctx.json==='function'){
        ctx.json().then(function(b){ toast('Label failed', (b&&b.error)||r.error.message, 'err'); }).catch(function(){ toast('Label failed', r.error.message, 'err'); });
      } else { toast('Label failed', r.error.message||'Could not buy the label', 'err'); }
      reset(); return;
    }
    var d = r.data||{};
    if(d.error){ toast('Label failed', d.error, 'err'); reset(); return; }
    var i = state.orders.findIndex(function(x){return x.id===id;});
    if(i>=0){ state.orders[i]=Object.assign({},state.orders[i],{
      carrier:d.carrier, service_level:d.service_level, tracking_number:d.tracking_number,
      tracking_url:d.tracking_url, label_url:d.label_url, shipping_cost:d.shipping_cost,
      shipped_at:d.shipped_at, shippo_object_id:d.shippo_object_id
    }); }
    toast(d.already?'Label already bought':'Label ready', (d.service_level||'USPS')+' · '+money(d.shipping_cost), 'ok');
    renderDrawer(); render();
    if(d.label_url){ window.open(d.label_url, '_blank', 'noopener'); }
  }).catch(function(e){ toast('Label failed', String((e&&e.message)||e), 'err'); reset(); });
}

// Flip a local-pickup order to shipping by adding a ship-to address. Fees are
// left untouched (Paige collects any postage from the buyer offline); this only
// sets fulfillment + speed + address so the buy-label flow unlocks. One-way.
function switchToShipping(id){
  // Prefer the state draft (kept current on every keystroke) and fall back to the
  // live inputs — so this is correct even if a re-render just rebuilt the DOM fields.
  var d = (state.shipDraft && state.shipDraft.id===id) ? state.shipDraft : {};
  var pick=function(key,sel){ if(d[key]!=null && String(d[key]).trim()!=='') return String(d[key]).trim(); var n=$(sel); return n?String(n.value).trim():''; };
  var l1=pick('l1','#swL1'), city=pick('city','#swCity'), region=pick('region','#swRegion').toUpperCase(), zip=pick('zip','#swZip');
  if(!l1||!city||!region||!zip){ toast('Missing address','Street, city, state and ZIP are all required.','err'); return; }
  var patch = {
    fulfillment:'shipping', ship_speed:'standard',
    ship_to_name: pick('name','#swName')||null,
    address_line1:l1, address_line2:(pick('l2','#swL2')||null),
    city:city, region:region, postal_code:zip
  };
  state.shipDraft=null; // committed — drop the draft
  updateOrder(id, patch, 'Switched to shipping'); // optimistic: patches state synchronously, then persists
  renderDrawer(); // re-render into the Shipping + buy-label sections
}

/* ───────────────────────── mutations ───────────────────────── */
function updateOrder(id, patch, okMsg){
  var i=state.orders.findIndex(function(x){return x.id===id;});
  var prev = i>=0?Object.assign({},state.orders[i]):null;
  if(i>=0){ state.orders[i]=Object.assign({},state.orders[i],patch); }
  render();
  sb.from('orders').update(patch).eq('id',id).then(function(r){
    if(r.error){ if(prev){state.orders[i]=prev;} render(); toast('Update failed', r.error.message, 'err'); }
    else if(okMsg){ toast(okMsg,'','ok'); }
  });
}
// Toggle the standalone "money arrived" flag (separate from the status flow).
// Flipping it ON also emails the customer ("Payment verified" template) — the
// follow-through on the order-received email's "I'll confirm your payment".
// Only a real not-collected → collected flip sends, and never once the order
// is completed/cancelled (backfilling the flag for bookkeeping shouldn't email
// "you're in the queue" after "your set shipped").
function setPaymentCollected(id, val){
  var o = state.orders.find(function(x){return x.id===id;});
  var flipped = !!val && !!o && !o.payment_collected;
  updateOrder(id, { payment_collected: val, paid_at: val ? new Date().toISOString() : null }, val ? 'Payment marked collected' : 'Marked not collected');
  if(flipped && o.status!=='completed' && o.status!=='cancelled') notifyCustomer(o, 'payment_verified');
}
function setStatus(id, status){
  var patch = { status: status };
  var o = state.orders.find(function(x){return x.id===id;});
  var changed = !o || o.status!==status;
  // Completed is the single finish line (pickup: picked up; shipping: shipped) —
  // lock in the tier price as the quote if none was set.
  if(status==='completed' && o && o.quoted_price==null){ patch.quoted_price = o.tier_price; }
  updateOrder(id, patch, 'Moved to '+(STATUS[status]?STATUS[status].label:status));
  // Email the customer about the new status. Cancellation is sent manually
  // (see sendCancelEmail); skip re-sends when the status didn't change (dedupe).
  if(o && changed && status!=='cancelled') notifyCustomer(Object.assign({}, o, patch), status);
}
// Soft-cancel: keeps the order (status='cancelled', reversible via Reopen) and
// never auto-emails. The everyday "this order fell through" action; hard delete
// lives only on the orders-list row.
function cancelOrder(id){
  var o = state.orders.find(function(x){return x.id===id;});
  if(o && o.status==='cancelled') return;
  if(!confirm('Cancel this order for '+(o?o.customer_name:'this customer')+'? You can reopen it later.')) return;
  setStatus(id, 'cancelled');
}
// Manually send the cancellation email (never auto-fired — Paige sends it
// deliberately, alongside issuing the refund).
function sendCancelEmail(id){
  var o = state.orders.find(function(x){return x.id===id;});
  if(!o) return;
  if(!o.email){ toast('No email on file', 'This order has no email address.', 'err'); return; }
  if(!confirm('Send the cancellation email to '+o.email+'?')) return;
  notifyCustomer(o, 'cancelled');
}
// Re-send the "waiting on payment" nudge while the order is already Unpaid
// (setStatus dedupes no-op transitions, so a plain re-click wouldn't email).
function resendUnpaidEmail(id){
  var o = state.orders.find(function(x){return x.id===id;});
  if(!o) return;
  if(!o.email){ toast('No email on file', 'This order has no email address.', 'err'); return; }
  if(!confirm('Send the payment reminder to '+o.email+'?')) return;
  notifyCustomer(o, 'unpaid');
}
function markSeen(ids){
  ids.forEach(function(id){ var i=state.orders.findIndex(function(x){return x.id===id;}); if(i>=0)state.orders[i].admin_seen=true; });
  render();
  sb.from('orders').update({admin_seen:true}).in('id',ids).then(function(){});
}
function delOrder(id){
  var o=state.orders.find(function(x){return x.id===id;});
  if(!confirm('Delete order from '+(o?o.customer_name:'this customer')+'? This can’t be undone.')) return;
  state.orders = state.orders.filter(function(x){return x.id!==id;});
  if(state.drawerId===id) state.drawerId=null;
  render();
  sb.from('orders').delete().eq('id',id).then(function(r){ if(r.error) toast('Delete failed', r.error.message,'err'); else toast('Order deleted','','ok'); });
}

  document.querySelectorAll('[data-gc-generate]').forEach(function(b){ b.onclick=function(){ generateGiftCard(b); }; });
  document.querySelectorAll('[data-gc-issue]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); issueGiftCard(b.getAttribute('data-gc-issue')); }; });
  document.querySelectorAll('[data-gc-redeem]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); redeemGiftCard(b.getAttribute('data-gc-redeem')); }; });
  document.querySelectorAll('[data-gc-void]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); voidGiftCard(b.getAttribute('data-gc-void')); }; });
  document.querySelectorAll('[data-gc-open]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); openGiftCard(b.getAttribute('data-gc-open')); }; });
  document.querySelectorAll('[data-au-invite]').forEach(function(b){ b.onclick=function(){ inviteAdminUser(b); }; });
  document.querySelectorAll('[data-au-edit]').forEach(function(b){ b.onclick=function(){ renameAdminUser(b.getAttribute('data-au-edit')); }; });
  document.querySelectorAll('[data-au-del]').forEach(function(b){ b.onclick=function(){ deleteAdminUser(b.getAttribute('data-au-del')); }; });
  document.querySelectorAll('[data-au-email],[data-au-name]').forEach(function(inp){ inp.onkeydown=function(e){ if(e.key==='Enter'){ var b=$('[data-au-invite]'); if(b) inviteAdminUser(b); } }; });

  var bell=$('#bell'); if(bell) bell.onclick=function(e){ e.stopPropagation(); state.notifOpen=!state.notifOpen; render(); };
  var burger=$('#burger'); if(burger) burger.onclick=function(e){ e.stopPropagation(); state.sidebarOpen=!state.sidebarOpen; var s=$('#sidebar'); if(s)s.classList.toggle('open',state.sidebarOpen); };
  var so=$('#signout'); if(so) so.onclick=function(){ sb.auth.signOut(); };

  var gs=$('#globalSearch'); if(gs) gs.oninput=function(){ state.q=gs.value; if(state.view!=='orders'){ state.view='orders'; } var rows=filteredOrders(); var tw=$('.table-wrap'); if(state.view==='orders'){ render(); var g=$('#globalSearch'); if(g){ g.focus(); g.setSelectionRange(g.value.length,g.value.length); } } };
}

// close popovers on outside click / escape
document.addEventListener('click', function(){ if(state.notifOpen){ state.notifOpen=false; renderNotif(); } });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(state.drawerId||state.giftDrawerId){closeDrawer();} else if(state.view==='customers'&&state.custSel){state.custSel=null;render();} else if(state.notifOpen){state.notifOpen=false;renderNotif();} else if(state.sidebarOpen){state.sidebarOpen=false;var s=$('#sidebar');if(s)s.classList.remove('open');} } });

/* ───────────────────────── boot ───────────────────────── */
function start(session){
  if(session && session.user){
    // Arrived via an invite / password-reset link → let them set a password first.
    if(pwFlow){ state.user = null; renderSetPassword(); return; }
    // Access gate: claim_admin_access() approves an invited teammate on their
    // first sign-in and returns whether this account may administer at all.
    // (The bootstrap owner always passes; anyone not on the allowlist is signed out.)
    sb.rpc('claim_admin_access').then(function(r){
      if(r.error || r.data !== true){
        sb.auth.signOut().then(function(){ renderAuth('That account isn’t authorised for this admin.','err'); });
        return;
      }
      state.user = session.user;
      loadAll();
      subscribeRealtime();
    });
  } else {
    state.user = null;
    renderAuth();
  }
}

// Set-password screen shown when someone opens an invite / reset link. Once the
// password is saved we re-run start(), which approves them and loads the admin.
function renderSetPassword(msg, kind){
  var root=$('#root');
  root.innerHTML =
    '<div class="auth"><div class="auth-card">'+
      '<img class="auth-mark" src="logo.jpeg" alt="Paige Madden Nails" />'+
      '<div class="auth-script">Paige Madden</div>'+
      '<div class="auth-sub">Orders Admin</div>'+
      '<p class="auth-hint">Welcome! Set a password to finish setting up your account.</p>'+
      '<div class="field"><label>New password</label><input class="input" id="pPass" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>'+
      '<div class="field"><label>Confirm password</label><input class="input" id="pPass2" type="password" autocomplete="new-password" placeholder="Re-enter password"></div>'+
      '<button class="btn" id="pSave">Set password &amp; continue</button>'+
      '<div class="auth-msg '+(kind||'')+'" id="pMsg">'+(msg||'')+'</div>'+
    '</div></div>';
  var btn=$('#pSave'), p1=$('#pPass'), p2=$('#pPass2');
  function submit(){
    var a=p1.value, b=p2.value;
    if((a||'').length<8){ $('#pMsg').className='auth-msg err'; $('#pMsg').textContent='Use at least 8 characters.'; return; }
    if(a!==b){ $('#pMsg').className='auth-msg err'; $('#pMsg').textContent='Passwords don’t match.'; return; }
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    sb.auth.updateUser({ password:a }).then(function(r){
      if(r.error){ btn.disabled=false; btn.textContent='Set password & continue'; $('#pMsg').className='auth-msg err'; $('#pMsg').textContent=r.error.message; return; }
      pwFlow=false;
      try{ history.replaceState(null,'',window.location.pathname+window.location.search); }catch(e){}
      sb.auth.getSession().then(function(s){ start(s.data.session); });
    });
  }
  p1.addEventListener('keydown', function(e){ if(e.key==='Enter') p2.focus(); });
  p2.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  btn.onclick=submit;
}

sb.auth.getSession().then(function(r){ start(r.data.session); });
sb.auth.onAuthStateChange(function(evt, session){
  if(evt==='SIGNED_OUT'){ state.user=null; authStep='email'; renderAuth('Signed out.'); return; }
  if(evt==='PASSWORD_RECOVERY'){ pwFlow=true; state.user=null; if(session) renderSetPassword(); return; }
  if((evt==='SIGNED_IN'||evt==='INITIAL_SESSION'||evt==='TOKEN_REFRESHED') && session && !state.user){ start(session); }
});
</script>
