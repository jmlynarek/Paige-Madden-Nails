<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F2" />
<meta name="robots" content="noindex, nofollow" />
<title>Paige Madden Nails — Orders Admin</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #FAF6F2;
    --blush: #FBEBEB;
    --rose: #B46869;
    --rose-deep: #9C5455;
    --dusty: #DC8289;
    --highlight: #F1BCBD;
    --card: #EDE5DE;
    --neutral: #B69886;
    --ink: #5F463F;
    --ink-2: #8C6A60;
    --ink-soft: rgba(95, 70, 63, 0.60);
    --hair: rgba(95, 70, 63, 0.10);
    --line: rgba(95, 70, 63, 0.14);
    --surface: #FFFFFF;
    --surface-2: #FBF8F5;
    --shadow: 0 1px 2px rgba(95,70,63,0.04), 0 14px 34px rgba(95,70,63,0.07);
    --shadow-sm: 0 1px 2px rgba(95,70,63,0.05), 0 6px 16px rgba(95,70,63,0.05);
    --shadow-pop: 0 18px 50px rgba(95,70,63,0.18);
    --serif: 'Cormorant Garamond', serif;
    --script: 'Pinyon Script', cursive;
    --sans: 'Hanken Grotesk', system-ui, sans-serif;
    --r: 16px;
    --r-sm: 11px;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    background: radial-gradient(120% 80% at 50% 0%, #F4EEE8 0%, #E9E0D7 100%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  a { color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--highlight); color: var(--ink); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(95,70,63,0.18); border-radius: 20px; border: 3px solid transparent; background-clip: content-box; }

  /* ===================== LOGIN ===================== */
  .auth {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    padding-top: calc(24px + var(--safe-top));
  }
  .auth-card {
    width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; box-shadow: var(--shadow); padding: 34px 30px 30px; text-align: center;
  }
  .auth-mark { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px; display: block;
    object-fit: cover; mix-blend-mode: multiply; }
  .auth-script { font-family: var(--script); font-size: 34px; color: var(--rose); line-height: 1; margin: 2px 0 4px; }
  .auth-sub { font-family: var(--serif); font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
  .auth-hint { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 22px; line-height: 1.5; }
  .field { text-align: left; margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 7px; }
  .input {
    width: 100%; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    border-radius: var(--r-sm); padding: 13px 14px; font-size: 15px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .input:focus { border-color: var(--dusty); box-shadow: 0 0 0 3px rgba(220,130,137,.16); background: var(--surface); }
  .otp { letter-spacing: .42em; text-align: center; font-size: 20px; font-weight: 600; }
  .btn {
    width: 100%; border: 0; border-radius: var(--r-sm); padding: 13px 16px; font-size: 15px; font-weight: 700;
    color: #fff; background: linear-gradient(150deg, var(--dusty), var(--rose)); box-shadow: 0 8px 20px rgba(180,104,105,.28);
    transition: transform .12s, box-shadow .12s, opacity .12s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(180,104,105,.34); }
  .btn:active { transform: translateY(0); }
  .btn[disabled] { opacity: .55; pointer-events: none; }
  .btn svg, .btn-line svg { width: 17px; height: 17px; flex: none; }
  .btn-pay { background: linear-gradient(150deg, #5E9070, #0E7E5B); box-shadow: 0 8px 20px rgba(14,126,91,.24); }
  .btn-pay:hover { box-shadow: 0 12px 26px rgba(14,126,91,.3); }
  .btn-ghost { background: transparent; color: var(--ink-2); box-shadow: none; font-weight: 600; }
  .btn-ghost:hover { transform: none; box-shadow: none; color: var(--rose); }
  /* small pill button for secondary drawer actions — matches the badge/pill language */
  .btn-chip { width: auto; flex: none; padding: 7px 13px; font-size: 12.5px; font-weight: 700; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); box-shadow: none; }
  .btn-chip:hover { background: var(--line); color: var(--ink); transform: none; box-shadow: none; }
  .btn-chip.warn { color: #C77A3B; background: #FBF4EA; border-color: #EFD9C2; }
  .btn-chip.warn:hover { background: #F6E7D4; color: #C77A3B; }
  .btn-chip.danger { color: #C9534A; background: #FCEDEB; border-color: #F1CDC8; }
  .btn-chip.danger:hover { background: #FADFDB; color: #C9534A; }
  .auth-msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
  .auth-msg.err { color: #C9534A; }
  .auth-msg.ok { color: #2BA05A; }

  /* ===================== SHELL ===================== */
  .shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100dvh; }
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column;
    padding: 20px 16px calc(16px + var(--safe-bottom)); position: sticky; top: 0; height: 100dvh;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }
  .brand-mark { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; mix-blend-mode: multiply; flex: none; }
  .brand-name { font-family: var(--script); font-size: 25px; color: var(--rose); line-height: .9; }
  .brand-sub { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); margin-top: 2px; }
  .nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); padding: 14px 10px 8px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent; text-align: left;
    padding: 11px 12px; border-radius: 12px; color: var(--ink-2); font-size: 14.5px; font-weight: 600; transition: background .14s, color .14s;
  }
  .nav-item svg { width: 19px; height: 19px; flex: none; opacity: .85; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active { background: linear-gradient(150deg, rgba(220,130,137,.16), rgba(180,104,105,.14)); color: var(--rose-deep); }
  .nav-item.active svg { opacity: 1; }
  .nav-count { margin-left: auto; font-size: 12px; font-weight: 700; background: var(--blush); color: var(--rose); border-radius: 20px; padding: 1px 8px; }
  .nav-bottom { margin-top: auto; padding-top: 14px; }
  .sidebar-foot { margin-top: 12px; border-top: 1px solid var(--hair); padding-top: 12px; }
  .me { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; }
  .me .avatar { width: 34px; height: 34px; font-size: 13px; }
  .me-name { font-size: 13.5px; font-weight: 700; line-height: 1.1; }
  .me-mail { font-size: 11.5px; color: var(--ink-soft); }
  .me-out { margin-left: auto; background: transparent; border: 0; color: var(--ink-soft); display: grid; place-items: center; padding: 6px; border-radius: 9px; }
  .me-out:hover { background: var(--blush); color: var(--rose); }
  .me-out svg { width: 18px; height: 18px; }

  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 14px;
    padding: 14px 26px; padding-top: calc(14px + var(--safe-top));
    background: rgba(250,246,242,.82); backdrop-filter: saturate(140%) blur(12px); border-bottom: 1px solid var(--hair);
  }
  .burger { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; place-items: center; color: var(--ink-2); }
  .burger svg { width: 19px; height: 19px; }
  .crumb { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--ink); letter-spacing: .01em; }
  .crumb small { display: block; font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0; margin-top: 1px; }
  .top-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--ink-soft); }
  .search input { width: 230px; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 12px 10px 36px; font-size: 14px; color: var(--ink); outline: none; transition: width .2s, border-color .15s, box-shadow .15s; }
  .search input:focus { border-color: var(--dusty); box-shadow: 0 0 0 3px rgba(220,130,137,.14); }
  .icon-btn { position: relative; width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); transition: background .14s, color .14s, border-color .14s; }
  .icon-btn:hover { background: var(--blush); color: var(--rose); border-color: var(--highlight); }
  .icon-btn svg { width: 19px; height: 19px; }
  .badge-dot { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 20px; background: var(--rose); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }

  .content { padding: 22px 26px 60px; max-width: 1340px; width: 100%; margin: 0 auto; }

  /* ===================== CARDS / KPIs ===================== */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 17px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; }
  .kpi-top { display: flex; align-items: center; gap: 9px; color: var(--ink-soft); font-size: 12.5px; font-weight: 600; }
  .kpi-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }
  .kpi-ic svg { width: 17px; height: 17px; }
  .kpi-val { font-size: 29px; font-weight: 800; letter-spacing: -.02em; margin-top: 10px; line-height: 1; }
  .kpi-sub { font-size: 12px; color: var(--ink-soft); margin-top: 7px; display: flex; align-items: center; gap: 6px; }
  .trend { font-weight: 700; }
  .trend.up { color: #2BA05A; } .trend.down { color: #C9534A; }

  .grid-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; margin-bottom: 16px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); }
  .panel-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
  .panel-t { font-size: 15px; font-weight: 700; }
  .panel-t small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-top: 2px; }
  .panel-tools { margin-left: auto; display: flex; gap: 6px; }
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; color: var(--ink-soft); font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 7px; }
  .seg button.on { background: var(--surface); color: var(--rose); box-shadow: var(--shadow-sm); }
  .panel-b { padding: 6px 18px 18px; }

  .legend { display: flex; flex-direction: column; gap: 9px; padding: 4px 4px 0; }
  .legend-row { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .legend-row .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend-row .lg-name { color: var(--ink-2); font-weight: 600; }
  .legend-row .lg-val { margin-left: auto; font-weight: 700; }
  .legend-row .lg-pct { color: var(--ink-soft); font-size: 12px; width: 38px; text-align: right; }

  /* ===================== ORDERS TABLE ===================== */
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .tab { display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; background: transparent; color: var(--ink-2); font-size: 13.5px; font-weight: 600; padding: 8px 13px; border-radius: 10px; }
  .tab .tdot { width: 7px; height: 7px; border-radius: 50%; }
  .tab .tnum { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .tab:hover { background: var(--surface); }
  .tab.on { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow-sm); color: var(--ink); }
  .tab.on .tnum { color: var(--rose); }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-left: auto; }

  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); overflow: hidden; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .tbl thead th { text-align: left; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; padding: 13px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl tbody td { padding: 13px 16px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
  .tbl tbody tr { transition: background .12s; cursor: pointer; }
  .tbl tbody tr:hover { background: var(--surface-2); }
  .tbl tbody tr:last-child td { border-bottom: 0; }
  .oid { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .cust { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11.5px; font-weight: 700; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
  .cust-name { font-weight: 600; }
  .muted { color: var(--ink-soft); }
  .money { font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
  .pill .pdot { width: 6px; height: 6px; border-radius: 50%; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .chip svg { width: 14px; height: 14px; opacity: .7; }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .ico { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); }
  .ico:hover { background: var(--blush); color: var(--rose); border-color: var(--highlight); }
  .ico.danger:hover { background: #FBE9E7; color: #C9534A; border-color: #F3C7C2; }
  .ico.pay { color: rgba(95, 70, 63, 0.32); }
  .ico.pay.on { background: #EAF3EC; color: #0E7E5B; border-color: #CBE2D2; }
  .ico.pay.on:hover { background: #DFEEE4; color: #0E7E5B; border-color: #B9D6C4; }
  .ico svg { width: 15px; height: 15px; }
  .unseen-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rose); display: inline-block; margin-right: 2px; }

  .empty { text-align: center; padding: 56px 20px; color: var(--ink-soft); }
  .empty svg { width: 40px; height: 40px; opacity: .4; margin-bottom: 12px; }

  /* ===================== DRAWER ===================== */
  .scrim { position: fixed; inset: 0; background: rgba(60,42,38,.34); backdrop-filter: blur(2px); z-index: 90; opacity: 0; transition: opacity .2s; }
  .scrim.show { opacity: 1; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100dvh; width: 600px; max-width: 96vw; z-index: 100;
    background: var(--bg); box-shadow: var(--shadow-pop); transform: translateX(102%); transition: transform .26s cubic-bezier(.4,.0,.2,1);
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: translateX(0); }
  .dr-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 16px; padding-top: calc(20px + var(--safe-top)); border-bottom: 1px solid var(--line); background: var(--surface); }
  .dr-head .avatar { width: 44px; height: 44px; font-size: 15px; }
  .dr-head-main { min-width: 0; flex: 1; }
  /* Order number is the hero of the header — Paige reconciles payments by PM-### */
  .dr-ordno { font-size: 30px; font-weight: 800; letter-spacing: .5px; color: var(--rose); line-height: 1.04; }
  .dr-title { font-size: 15px; font-weight: 700; color: var(--ink-2); margin-top: 1px; }
  .dr-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .dr-x { margin-left: auto; }
  .dr-body { overflow-y: auto; padding: 0 22px calc(26px + var(--safe-bottom)); flex: 1; }
  .dr-sec { margin-bottom: 20px; scroll-margin-top: 54px; }
  .dr-sec:first-of-type { margin-top: 4px; }
  .dr-nav { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 6px; margin: 0 -22px 16px; padding: 12px 22px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .dr-nav button { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .01em; color: var(--ink-soft); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px 5px 9px; cursor: pointer; white-space: nowrap; transition: all .14s; }
  .dr-nav button svg { width: 14px; height: 14px; }
  .dr-nav button:hover { color: var(--rose); border-color: var(--dusty); background: var(--blush); }

  /* accordion sections */
  .acc { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin-bottom: 10px; scroll-margin-top: 58px; }
  .acc-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 13px 14px; background: transparent; border: 0; cursor: pointer; font: inherit; text-align: left; color: var(--ink); border-radius: 14px; }
  .acc-h:hover { background: var(--surface-2); }
  .acc-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .acc-r { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .acc-ic { display: inline-flex; color: var(--rose); flex: none; }
  .acc-ic svg { width: 18px; height: 18px; }
  .acc-t { font-size: 13.5px; font-weight: 800; letter-spacing: .01em; }
  .acc-sub { font-size: 12px; font-weight: 600; color: var(--ink-soft); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 230px; display: flex; align-items: center; }
  .acc-chev { display: inline-flex; color: var(--ink-soft); transition: transform .2s; flex: none; }
  .acc-chev svg { width: 18px; height: 18px; }
  /* compact state badge in a collapsed section header — an at-a-glance status cue */
  .acc-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; flex: none; }
  .acc-badge svg { width: 13px; height: 13px; }
  .acc-badge.ok   { background: #E5F4EA; color: #1F8F50; }
  .acc-badge.warn { background: #FBF0E4; color: #C77A3B; }
  .acc-badge.info { background: #EAF1FC; color: #3B7DD8; }
  .acc.open > .acc-h .acc-sub { display: none; }
  .acc.open > .acc-h .acc-chev { transform: rotate(180deg); }
  .acc.open > .acc-h { border-bottom: 1px solid var(--hair); border-radius: 14px 14px 0 0; }
  .acc-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
  .acc.open > .acc-b { grid-template-rows: 1fr; }
  .acc-b-in { overflow: hidden; }
  .acc-pad { padding: 14px; }
  .dr-sec-t { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; margin-bottom: 10px; }
  .dr-card { background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 4px 14px; }
  .kv { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 13.5px; }
  .kv:last-child { border-bottom: 0; }
  .kv .k { color: var(--ink-soft); width: 92px; flex: none; font-weight: 600; }
  .kv .k svg { width: 17px; height: 17px; display: block; }
  .kv .v { font-weight: 600; color: var(--ink); }
  .kv .v a { color: var(--rose); text-decoration: none; }
  .sizes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .size { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; text-align: center; padding: 9px 4px; }
  .size .fn { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }

// One unified flow for every order — pickup and shipping alike:
// New → In Progress → Ready → Completed. "Ready" means the set is finished
// (pickup: ready to grab; shipping: ready to ship — buy the label in the
// drawer); "Completed" means handed off (picked up / shipped).
// "Unpaid" and "Cancelled" are deliberately side-flags, NOT steps in this line.
function flowFor(o){
  return ['new','in_progress','ready','completed'];
}
// Full ordered status set (drives tabs, the pipeline chart, and the
// editable notification templates). Each one can carry a customer email.
// "Unpaid" sits right after "New": an order arrives, payment can't be matched,
// Paige flags it Unpaid (emails a gentle nudge), then moves it on once paid.
var ALL_STATUSES = ['new','unpaid','in_progress','ready','completed','cancelled'];

/* ───────────────────────── helpers ───────────────────────── */
function $(s, r){ return (r||document).querySelector(s); }
function el(tag, cls, html){ var n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ n = Number(n||0); return '$' + n.toLocaleString('en-US',{minimumFractionDigits: n%1?2:0, maximumFractionDigits:2}); }
function orderSetPrice(o){ return Number(o.quoted_price != null ? o.quoted_price : (o.tier_price != null ? o.tier_price : 0)); }
// Total the customer was asked to pay: set price + shipping + rush line items.
function orderValue(o){ return orderSetPrice(o) + Number(o.ship_fee || 0) + Number(o.rush_fee || 0); }
function shortId(o){ return o.order_no != null ? 'PM-' + o.order_no : '#' + String(o.id).replace(/-/g,'').slice(0,7).toUpperCase(); }
function initials(name){ var p=String(name||'?').trim().split(/\s+/); return ((p[0]||'')[0]||'?').toUpperCase() + ((p[1]||'')[0]||'').toUpperCase(); }
var AV = ['#B46869','#DC8289','#C98A12','#7C5CDA','#0E9E8E','#3B7DD8','#2BA05A','#B69886'];
function avColor(name){ var s=0; name=String(name||''); for(var i=0;i<name.length;i++) s+=name.charCodeAt(i); return AV[s%AV.length]; }
function avatar(name, cls){ return '<span class="avatar '+(cls||'')+'" style="background:'+avColor(name)+'">'+esc(initials(name))+'</span>'; }
function fmtDate(d){ d=new Date(d); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' · ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function dayKey(d){ d=new Date(d); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function ago(d){
  var s=(Date.now()-new Date(d).getTime())/1000;
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<604800) return Math.floor(s/86400)+'d ago';
  return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function statusPill(s){ var m=STATUS[s]||{label:s,color:'#888',bg:'#eee'}; return '<span class="pill" style="background:'+m.bg+';color:'+m.color+'"><span class="pdot" style="background:'+m.color+'"></span>'+m.label+'</span>'; }
// Compact status cue shown at the top-right of an accordion section header,
// visible whether the section is open or collapsed. tone: 'ok' | 'warn' | 'info'.
function accBadge(text, tone, withCheck){ return '<span class="acc-badge '+(tone||'info')+'">'+(withCheck?I.check:'')+text+'</span>'; }

/* ───────────────────────── toasts ───────────────────────── */
function toast(title, sub, kind){
  var wrap = $('#toasts'); if(!wrap){ wrap = el('div','toasts'); wrap.id='toasts'; document.body.appendChild(wrap); }
  var t = el('div','toast '+(kind||''));
  var ic = kind==='ok'?I.check : kind==='err'?I.x : I.bell;
  t.innerHTML = '<span class="ti">'+ic+'</span><div><div class="tt">'+esc(title)+'</div>'+(sub?'<div class="ts">'+esc(sub)+'</div>':'')+'</div>';
  wrap.appendChild(t);
  setTimeout(function(){ t.style.transition='opacity .3s, transform .3s'; t.style.opacity='0'; t.style.transform='translateY(8px)'; setTimeout(function(){ t.remove(); }, 320); }, 4200);
}

/* ───────────────────────── auth ───────────────────────── */
var authStep = 'email', authEmail = ADMIN_EMAIL;

function renderAuth(msg, kind){
  var root = $('#root');
  root.innerHTML =
    '<div class="auth"><div class="auth-card">'+
      '<img class="auth-mark" src="logo.jpeg" alt="Paige Madden Nails" />'+
      '<div class="auth-script">Paige Madden</div>'+
      '<div class="auth-sub">Orders Admin</div>'+
      '<p class="auth-hint">Sign in to manage your orders.</p>'+
      '<div class="field"><label>Email</label><input class="input" id="aEmail" type="email" autocomplete="email" value="'+esc(authEmail)+'" placeholder="you@email.com"></div>'+
      '<div class="field"><label>Password</label><input class="input" id="aPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>'+
      '<button class="btn" id="aSignin">Sign in</button>'+
      '<div class="auth-msg '+(kind||'')+'" id="aMsg">'+(msg||'')+'</div>'+
    '</div></div>';

  var btn=$('#aSignin'), em=$('#aEmail'), pw=$('#aPass');
  function submit(){
    authEmail = em.value.trim().toLowerCase();
    var pass = pw.value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(authEmail)){ $('#aMsg').className='auth-msg err'; $('#aMsg').textContent='Please enter a valid email.'; return; }
    if(!pass){ $('#aMsg').className='auth-msg err'; $('#aMsg').textContent='Enter your password.'; return; }
    btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
    sb.auth.signInWithPassword({ email: authEmail, password: pass }).then(function(r){
      if(r.error){ btn.disabled=false; btn.textContent='Sign in'; $('#aMsg').className='auth-msg err'; $('#aMsg').textContent=r.error.message; return; }
      // onAuthStateChange handles the rest
    });
  }
  em.addEventListener('keydown', function(e){ if(e.key==='Enter') pw.focus(); });
  pw.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  btn.onclick=submit;
}

/* ───────────────────────── data ───────────────────────── */
function loadAll(){
  state.loading = true;
  return Promise.all([
    sb.from('orders').select('*').order('created_at',{ascending:false}),
    sb.from('design_tiers').select('*'),
    sb.from('nail_shapes').select('*'),
    sb.from('payment_methods').select('*').order('sort'),
    sb.from('notification_templates').select('*').order('sort'),
    sb.from('scheduled_sends').select('*').order('created_at',{ascending:false}),
    sb.from('email_optouts').select('*').order('opted_out_at',{ascending:false}),
    sb.from('app_settings').select('*'),
    sb.from('gift_cards').select('*').order('created_at',{ascending:false}),
    sb.from('waitlist_leads').select('*').order('created_at',{ascending:true}),
    sb.from('admin_users').select('*').order('created_at',{ascending:true}),
    sb.from('customer_notes').select('*')
  ]).then(function(res){
    if(res[0].error) throw res[0].error;
    state.orders    = res[0].data || [];
    state.tiers     = res[1].data || [];
    state.shapes    = res[2].data || [];
    state.payments  = res[3].data || [];
    state.templates = res[4].data || [];
    state.scheduled = (res[5] && res[5].data) || [];
    state.optouts   = (res[6] && res[6].data) || [];
    state.settings  = {};
    ((res[7] && res[7].data) || []).forEach(function(r){ state.settings[r.key] = r.value; });
    state.giftCards = (res[8] && res[8].data) || [];
    state.waitlist  = (res[9] && res[9].data) || [];
    state.adminUsers = (res[10] && res[10].data) || [];
    state.custNotes = {};
    ((res[11] && res[11].data) || []).forEach(function(r){ state.custNotes[r.key] = r.notes || ''; });
    state.loading = false;
    render();
  }).catch(function(e){
    state.loading = false;
    $('#root').innerHTML = '<div class="loading-full">Couldn’t load orders: '+esc(e.message||e)+'</div>';
  });
}

function subscribeRealtime(){
  sb.channel('orders-feed')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'orders' }, function(p){
      var o = p.new;
      if(!state.orders.some(function(x){return x.id===o.id;})){
        state.orders.unshift(o);
        if(o.gift_shipment_id) toast('Gift card to ship', (o.customer_name||'recipient')+' · mail the card', 'ok');
        else toast('New order from '+(o.customer_name||'someone'), money(orderValue(o))+' · '+(STATUS[o.status]?STATUS[o.status].label:o.status), 'ok');
        render();
      }
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'orders' }, function(p){
      var i = state.orders.findIndex(function(x){return x.id===p.new.id;});
      if(i>=0){ state.orders[i]=p.new; render(); }
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'scheduled_sends' }, function(){
      refreshScheduled();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'gift_cards' }, function(p){
      // Live nudge when a customer buys a gift online (a new 'pending' card).
      if(p.eventType==='INSERT' && p.new && p.new.status==='pending'){
        var g=p.new, total=Number(g.amount||0)+Number(g.ship_fee||0);
        toast('New gift purchase — '+(g.purchase_ref||''), money(total)+' · awaiting payment', 'ok');
      }
      refreshGiftCards();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'waitlist_leads' }, function(p){
      if(p.eventType==='INSERT' && p.new){ toast('New waitlist signup', p.new.email||'', 'ok'); }
      refreshWaitlist();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'admin_users' }, function(){
      // Keeps the Users list live — most usefully, an invited teammate flips to
      // Approved the moment they accept and sign in.
      refreshAdminUsers();
    })
    .subscribe();
}

/* ───────────────────────── derived ───────────────────────── */
function counts(){
  var c={all:state.orders.length}; Object.keys(STATUS).forEach(function(k){c[k]=0;});
  state.orders.forEach(function(o){ if(c[o.status]!=null)c[o.status]++; });
  return c;
}
function unseen(){ return state.orders.filter(function(o){ return !o.admin_seen; }); }
// Everything worth surfacing in the topbar bell, newest first: unseen orders +
// pending gift purchases (money to collect, a card to send) + waitlist signups you
// haven't reached out to yet. Derived from workflow state — an item drops off the
// bell once it's handled (order marked seen, gift issued/voided, lead notified).
function notifItems(){
  var items = [];
  unseen().forEach(function(o){ items.push({ kind:'order', id:o.id, ts:o.created_at, order:o }); });
  (state.giftCards||[]).forEach(function(g){ if(g.status==='pending') items.push({ kind:'gift', id:g.id, ts:g.created_at, gift:g }); });
  (state.waitlist||[]).forEach(function(w){ if(!w.notified_at) items.push({ kind:'waitlist', id:w.id, ts:w.created_at, lead:w }); });
  items.sort(function(a,b){ return new Date(b.ts||0) - new Date(a.ts||0); });
  return items;
}
function filteredOrders(){
  var q=state.q.trim().toLowerCase();
  return state.orders.filter(function(o){
    if(state.filter!=='all' && o.status!==state.filter) return false;
    if(!q) return true;
    return (o.customer_name||'').toLowerCase().indexOf(q)>=0
        || (o.email||'').toLowerCase().indexOf(q)>=0
        || shortId(o).toLowerCase().indexOf(q)>=0
        || (o.nail_shape||'').toLowerCase().indexOf(q)>=0;
  });
}

/* ───────────────────────── charts (SVG) ───────────────────────── */
function barChart(days){
  var series=[], today=new Date(); today.setHours(0,0,0,0);
  var byDay={};
  state.orders.forEach(function(o){ var k=dayKey(o.created_at); byDay[k]=byDay[k]||{n:0,rev:0}; byDay[k].n++; byDay[k].rev+=orderValue(o); });
  for(var i=days-1;i>=0;i--){ var d=new Date(today); d.setDate(d.getDate()-i); var k=dayKey(d); series.push({d:d, n:byDay[k]?byDay[k].n:0, rev:byDay[k]?byDay[k].rev:0}); }
  var max=Math.max(1, series.reduce(function(m,s){return Math.max(m,s.n);},0));
  var W=640, H=180, pad=8, n=series.length, gap=days>14?3:6;
  var bw=(W-pad*2-gap*(n-1))/n;
  var bars='', labels='', gl='';
  for(var g=1;g<=3;g++){ var gy=pad+(H-pad*2)*(g/4); gl+='<line x1="0" y1="'+gy.toFixed(1)+'" x2="'+W+'" y2="'+gy.toFixed(1)+'" stroke="rgba(95,70,63,0.07)" stroke-width="1"/>'; }
  series.forEach(function(s,i){
    var h=(H-pad*2)*(s.n/max), x=pad+i*(bw+gap), y=H-pad-h;
    var hot=s.n>0;
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,hot?3:0).toFixed(1)+'" rx="'+Math.min(4,bw/2).toFixed(1)+'" fill="url(#bg1)"><title>'+s.d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+': '+s.n+' order'+(s.n===1?'':'s')+' · '+money(s.rev)+'</title></rect>';
    var showLbl = days<=14 || i%Math.ceil(days/8)===0;
    if(showLbl) labels+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H+13)+'" text-anchor="middle" font-size="9.5" fill="rgba(95,70,63,0.5)">'+s.d.getDate()+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+(H+18)+'" width="100%" preserveAspectRatio="none" style="display:block">'+
    '<defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DC8289"/><stop offset="1" stop-color="#B46869"/></linearGradient></defs>'+
    gl+bars+labels+'</svg>';
}

function donut(parts, total){
  var R=52, C=2*Math.PI*R, off=0, segs='';
  parts.forEach(function(p){
    if(p.v<=0) return;
    var len=C*(p.v/(total||1));
    segs+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+p.color+'" stroke-width="18" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 70 70)" stroke-linecap="butt"><title>'+p.name+': '+p.v+'</title></circle>';
    off+=len;
  });
  if(!total) segs='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="#EDE5DE" stroke-width="18"/>';
  return '<svg viewBox="0 0 140 140" width="140" height="140">'+segs+
    '<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="#5F463F">'+total+'</text>'+
    '<text x="70" y="84" text-anchor="middle" font-size="10.5" fill="rgba(95,70,63,0.55)" font-weight="600" letter-spacing=".05em">ORDERS</text></svg>';
}

/* ───────────────────────── views ───────────────────────── */
function viewDashboard(){
  var c = counts();
  var revenue = state.orders.filter(function(o){return o.status==='completed';}).reduce(function(s,o){return s+orderValue(o);},0);
  var pipeline = state.orders.filter(function(o){return ['new','in_progress','ready'].indexOf(o.status)>=0;}).reduce(function(s,o){return s+orderValue(o);},0);
  var avg = c.completed ? revenue/c.completed : 0;
  // last 7d vs prior 7d order count trend
  var now=Date.now(), d7=7*864e5;
  var cur=state.orders.filter(function(o){return now-new Date(o.created_at)<d7;}).length;
  var prev=state.orders.filter(function(o){var a=now-new Date(o.created_at);return a>=d7&&a<2*d7;}).length;
  var tr = prev===0 ? (cur>0?100:0) : Math.round((cur-prev)/prev*100);

  var kpi = function(ic, icbg, iccol, label, val, sub){
    return '<div class="kpi"><div class="kpi-top"><span class="kpi-ic" style="background:'+icbg+';color:'+iccol+'">'+ic+'</span>'+label+'</div>'+
      '<div class="kpi-val">'+val+'</div><div class="kpi-sub">'+sub+'</div></div>';
  };
  // Needs-attention = new orders to review + unpaid orders awaiting payment.
  var attn = c.new + (c.unpaid||0);
  var kpis = '<div class="kpis">'+
    kpi(I.cash,'#E5F4EA','#2BA05A','Revenue (completed)', money(revenue), c.completed+' completed order'+(c.completed===1?'':'s'))+
    kpi(I.spark,'#FBF1DC','#C98A12','Open pipeline', money(pipeline), (c.new+c.in_progress+c.ready)+' active')+
    kpi(I.cart,'#EAF1FC','#3B7DD8','Total orders', c.all, '<span class="trend '+(tr>=0?'up':'down')+'">'+(tr>=0?'▲':'▼')+' '+Math.abs(tr)+'%</span> last 7 days')+
    kpi(I.bell,'#FBE9EA','#B46869','Needs attention', attn, attn?(c.new+' new'+(c.unpaid?' · '+c.unpaid+' unpaid':''))+' to handle':'All caught up')+
  '</div>';

  var parts = ALL_STATUSES.map(function(k){ return {name:STATUS[k].label, v:c[k], color:STATUS[k].color}; });
  var legend = parts.map(function(p){
    var pct = c.all? Math.round(p.v/c.all*100):0;
    return '<div class="legend-row"><span class="dot" style="background:'+p.color+'"></span><span class="lg-name">'+p.name+'</span><span class="lg-val">'+p.v+'</span><span class="lg-pct">'+pct+'%</span></div>';
  }).join('');

  var mid = '<div class="grid-2">'+
    '<div class="panel"><div class="panel-h"><div class="panel-t">Orders over time<small>'+money(avg)+' average order value</small></div>'+
      '<div class="panel-tools"><div class="seg">'+
        '<button data-range="7" class="'+(state.range===7?'on':'')+'">7d</button>'+
        '<button data-range="30" class="'+(state.range===30?'on':'')+'">30d</button>'+
      '</div></div></div>'+
      '<div class="panel-b">'+barChart(state.range)+'</div></div>'+
    '<div class="panel"><div class="panel-h"><div class="panel-t">By status</div></div>'+
      '<div class="panel-b" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">'+
        '<div style="flex:none">'+donut(parts, c.all)+'</div>'+
        '<div class="legend" style="flex:1;min-width:150px">'+legend+'</div>'+
      '</div></div>'+
  '</div>';

  // tier split
  var tierAgg={}; state.orders.forEach(function(o){ var t=o.design_tier||'other'; tierAgg[t]=tierAgg[t]||{n:0,rev:0}; tierAgg[t].n++; tierAgg[t].rev+=orderValue(o); });
  var tierRows = Object.keys(tierAgg).map(function(t){
    var name = (state.tiers.find(function(x){return x.id===t;})||{}).name || (t.charAt(0).toUpperCase()+t.slice(1));
    var a=tierAgg[t], pct=c.all?Math.round(a.n/c.all*100):0;
    return '<div style="margin-bottom:12px"><div style="display:flex;font-size:13px;margin-bottom:5px"><span style="font-weight:700">'+esc(name)+'</span><span style="margin-left:auto;color:var(--ink-soft)">'+a.n+' · '+money(a.rev)+'</span></div>'+
      '<div style="height:8px;background:var(--surface-2);border-radius:20px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,var(--dusty),var(--rose));border-radius:20px"></div></div></div>';
  }).join('') || '<div class="muted" style="font-size:13px">No data yet.</div>';

  var recent = state.orders.slice(0,6);
  var recentRows = recent.map(function(o){
    return '<tr data-open="'+o.id+'"><td data-label="Customer"><div class="cust">'+avatar(o.customer_name)+'<span class="cust-name">'+esc(o.customer_name)+'</span></div></td>'+
      '<td data-label="Design" class="hide-sm"><span class="chip" style="color:var(--ink-soft)">'+I.palette+esc(o.nail_shape||'—')+'<span class="muted">· '+esc((state.tiers.find(function(x){return x.id===o.design_tier;})||{}).name||o.design_tier)+'</span></span></td>'+
      '<td data-label="Total"><span class="money">'+money(orderValue(o))+'</span></td>'+
      '<td data-label="Status">'+statusPill(o.status)+'</td>'+
      '<td data-label="When" class="muted hide-sm">'+ago(o.created_at)+'</td></tr>';
  }).join('');

  // gift card sales — a separate cash stream (booth money for future sets),
  // kept distinct from order revenue so nothing is double-counted.
  var gc = state.giftCards || [];
  var gcSum = function(a){ return a.reduce(function(s,c){ return s+Number(c.amount||0); }, 0); };
  var gcSold = gc.filter(function(c){ return c.status!=='void'; });
  var gcRedeemed = gc.filter(function(c){ return c.status==='redeemed'; });
  var gcActive = gc.filter(function(c){ return c.status==='active'; });
  var gcStat = function(label, val, sub, col){
    return '<div style="flex:1;min-width:130px"><div class="muted" style="font-size:12px;font-weight:600">'+label+'</div>'+
      '<div style="font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px;color:'+(col||'var(--ink)')+'">'+val+'</div>'+
      '<div class="muted" style="font-size:12px;margin-top:3px">'+sub+'</div></div>';
  };
  var giftPanel = '<div class="panel" style="margin-bottom:16px">'+
    '<div class="panel-h"><div class="panel-t">Gift card sales<small>Cash collected at the booth for future sets</small></div>'+
      '<div class="panel-tools"><button data-goto="giftcards" style="background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--rose)">Manage</button></div></div>'+
    '<div class="panel-b" style="display:flex;gap:22px;flex-wrap:wrap;padding-top:10px">'+
      (gc.length ?
        gcStat('Sold', money(gcSum(gcSold)), gcSold.length+' card'+(gcSold.length===1?'':'s'))+
        gcStat('Redeemed', money(gcSum(gcRedeemed)), gcRedeemed.length+' applied to orders', '#0E7E5B')+
        gcStat('Outstanding', money(gcSum(gcActive)), gcActive.length+' not yet used', '#C98A12')
        : '<div class="muted" style="font-size:13px">No gift cards yet. Generate one from the Gift Cards tab when you sell one.</div>')+
    '</div></div>';

  // customers — headline repeat-business numbers; the depth lives in the tab.
  // "Avg customer value" = all-time completed revenue ÷ distinct customers;
  // "Repeat revenue" = share of that revenue from people who ordered 2+ times.
  var cm = buildCustomers(), cl = cm.list;
  var cTotal = cl.length;
  var cLtvSum = cl.reduce(function(s,x){return s+x.ltv;},0);
  var cRepeat = cl.filter(function(x){return x.n>=2;});
  var cRepeatRev = cRepeat.reduce(function(s,x){return s+x.ltv;},0);
  var cOwed = cl.reduce(function(s,x){return s+x.outstanding;},0);
  var cDue = cl.filter(function(x){return x.due;}).length;
  var cTop = cl.slice().sort(function(a,b){return b.ltv-a.ltv;}).slice(0,3);
  var topMini = cTop.map(function(x){
    return '<button class="nt-row" style="padding:9px 12px" data-cust-jump="'+esc(x.key)+'">'+avatar(x.name)+
      '<span class="nt-row-main"><span class="nt-row-t" style="font-size:13.5px">'+esc(x.name)+'</span><span class="nt-row-sub">'+x.n+' order'+(x.n===1?'':'s')+'</span></span>'+
      '<span class="money">'+money(x.ltv)+'</span>'+
      '<span class="nt-row-chev">'+I.chev+'</span></button>';
  }).join('');
  var custPanel = '<div class="panel" style="margin-bottom:16px">'+
    '<div class="panel-h"><div class="panel-t">Customers<small>Repeat business &amp; customer value</small></div>'+
      '<div class="panel-tools"><button data-goto="customers" style="background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--rose)">View all</button></div></div>'+
    '<div class="panel-b" style="padding-top:10px">'+
      (cTotal ?
        '<div style="display:flex;gap:22px;flex-wrap:wrap">'+
          gcStat('Customers', cTotal, cRepeat.length+' repeat')+
          gcStat('Avg customer value', money(cLtvSum/cTotal), money(cLtvSum)+' collected all-time')+
          gcStat('Repeat rate', Math.round(cRepeat.length/cTotal*100)+'%', 'of customers reorder')+
          gcStat('Repeat revenue', (cLtvSum?Math.round(cRepeatRev/cLtvSum*100):0)+'%', 'from returning customers', '#0E7E5B')+
          gcStat('Outstanding', money(cOwed), cOwed>0?'placed, not collected':'all collected', cOwed>0?'#C77A3B':'#0E7E5B')+
          gcStat('Due for reorder', cDue, cDue?'quiet lately':'all engaged', cDue?'#C98A12':'var(--ink)')+
        '</div>'+
        (cTop.length?'<div class="dr-sec-t" style="margin:16px 0 8px">Top customers by lifetime value</div><div class="nt-rows">'+topMini+'</div>':'')
        : '<div class="muted" style="font-size:13px">No customers yet — someone becomes a customer when their first order is completed.</div>')+
    '</div></div>';

  var bottom = '<div class="grid-2">'+
    '<div class="panel"><div class="panel-h"><div class="panel-t">Recent orders</div><div class="panel-tools"><button class="seg" style="border:0;background:transparent;padding:0"><button data-goto="orders" style="background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--rose)">View all</button></button></div></div>'+
      '<div class="panel-b" style="padding:0 0 4px">'+(recent.length?'<table class="tbl">'+recentRows+'</table>':'<div class="empty">No orders yet.</div>')+'</div></div>'+
    '<div class="panel"><div class="panel-h"><div class="panel-t">By design tier</div></div><div class="panel-b">'+tierRows+'</div></div>'+
  '</div>';

  return '<div class="view">'+kpis+mid+custPanel+giftPanel+bottom+'</div>';
}

function viewOrders(){

        (o.gift_card_id?' <span class="chip" style="color:#B46869" title="Paid with a gift card">'+I.gift+'Prepaid</span>':'')+'</td>'+

      '<td data-label="Customer"><div class="cust">'+avatar(o.customer_name)+'<div><div class="cust-name">'+esc(o.customer_name)+'</div><div class="muted" style="font-size:11.5px">'+esc(o.email||o.phone||'')+'</div></div></div></td>'+

      '<td data-label="Total"><span class="money">'+money(orderValue(o))+'</span></td>'+

    '</tr>';
  }).join('') : '<tr><td colspan="8"><div class="empty">'+I.inbox+'<div>No orders match this view.</div></div></td></tr>';

  return '<div class="view"><div class="tabs">'+tabs+'</div>'+
    '<div class="table-wrap"><table class="tbl"><thead><tr>'+
      '<th>Order</th><th class="hide-sm">Date</th><th>Customer</th><th class="hide-sm">Design</th><th>Total</th><th>Status</th><th class="hide-sm">Fulfilment</th><th></th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div></div>';
}

  v = (v||'').trim();
  if(/^shippo_test_/.test(v)) return '<span class="pill" style="background:#FBF3E4;color:#9A7B2E"><span class="pdot" style="background:#C79A3A"></span>Test key · labels print “SAMPLE”</span>';

  if(v) return '<span class="pill" style="background:#F3EEF7;color:#6B5B8A"><span class="pdot" style="background:#8A76B0"></span>Custom key</span>';
  return '<span class="pill" style="background:#F4EFEA;color:#8A7A6A"><span class="pdot" style="background:#B7A896"></span>No key set — using the server’s saved key</span>';
}

function saveIntegrations(btn){
  var tog = document.querySelector('[data-shippo-toggle]');
  var enabled = tog ? tog.classList.contains('on') : true;
  var v = function(sel){ var el=document.querySelector(sel); return el ? el.value.trim() : ''; };
  var vals = {
    shippo_enabled:    enabled ? 'true' : 'false',
    shippo_api_key:    v('[data-shippo-key]'),
    ship_from_name:    v('[data-shipfrom-name]'),
    ship_from_street1: v('[data-shipfrom-street1]'),
    ship_from_street2: v('[data-shipfrom-street2]'),
    ship_from_city:    v('[data-shipfrom-city]'),
    ship_from_state:   v('[data-shipfrom-state]').toUpperCase(),
    ship_from_zip:     v('[data-shipfrom-zip]'),
    ship_from_country: (v('[data-shipfrom-country]')||'US').toUpperCase(),
    ship_from_phone:   v('[data-shipfrom-phone]'),
    ship_from_email:   v('[data-shipfrom-email]')
  };
  btn.disabled=true; var orig=btn.textContent; btn.innerHTML='<span class="spin"></span>';
  Promise.all(Object.keys(vals).map(function(k){
    return sb.from('app_settings').update({value:vals[k]}).eq('key',k);
  })).then(function(rs){
    btn.disabled=false; btn.textContent=orig;
    var err=rs.filter(function(r){return r.error;})[0];
    if(err){ toast('Couldn’t save', err.error.message,'err'); return; }
    Object.keys(vals).forEach(function(k){ state.settings[k]=vals[k]; });
    toast('Integrations saved', enabled?'Shipping is on':'Shipping is off','ok');
    render();
  });
}

// Fired on every status change. No-op send for now; flip on later.
function notifyCustomer(order, status){
  var tpl = tplFor(status);
  if(!tpl || tpl.enabled===false) return;        // template turned off → don't notify
  if(!order || !order.email) return;             // no email on file → nothing to send
  // Delivery orders skip the "Ready" email — it's Paige's internal cue to buy
  // the label; the customer hears from us at Completed (shipped + tracking).
  if(status==='ready' && order.fulfillment==='shipping') return;
  var html = renderEmailHtml(tpl, order);
  // Send via the send-order-email edge function (keeps the API key server-side).
  // Fire-and-report: never blocks the status change; surfaces failures as a toast.
  sb.functions.invoke('send-order-email', { body:{ to:order.email, subject:tpl.subject, html:html } })
    .then(function(r){
      if(r.error){
        var ctx=r.error.context;
        if(ctx && typeof ctx.json==='function'){ ctx.json().then(function(b){ toast('Email not sent',(b&&b.error)||r.error.message,'err'); }).catch(function(){ toast('Email not sent', r.error.message, 'err'); }); }
        else toast('Email not sent', r.error.message||'Could not send the email', 'err');
        return;
      }
      var d=r.data||{};
      if(d.error){ toast('Email not sent', d.error, 'err'); return; }
      toast('Email sent', tpl.subject+' → '+order.email, 'ok');
    })
    .catch(function(e){ toast('Email not sent', String((e&&e.message)||e), 'err'); });
}

  card.classList.toggle('off', !on);
  sb.from('notification_templates').update({ enabled: on, updated_at: new Date().toISOString() }).eq('status', status)
    .then(function(r){
      if(r.error){ toast('Couldn’t update', r.error.message, 'err'); return; }
      var t = state.templates.find(function(x){return x.status===status;});
      if(t) t.enabled = on;
      toast((STATUS[status]?STATUS[status].label:status)+(on?' notification on':' notification off'), '', 'ok');

function saveTemplate(status, btn){

  var subject = card.querySelector('[data-nt-subject]').value.trim();
  var heading = card.querySelector('[data-nt-heading]').value.trim();
  var body    = card.querySelector('[data-nt-body]').value.trim();
  var enabled = card.querySelector('[data-nt-toggle]').classList.contains('on');
  if(!subject || !heading || !body){ toast('Add a subject, heading and message', '', 'err'); return; }
  btn.disabled = true; var orig = btn.textContent; btn.innerHTML = '<span class="spin"></span>';
  sb.from('notification_templates').update({ subject:subject, heading:heading, body:body, enabled:enabled, updated_at:new Date().toISOString() }).eq('status', status)
    .then(function(r){
      btn.disabled = false; btn.textContent = orig;
      if(r.error){ toast('Couldn’t save', r.error.message, 'err'); return; }
      var t = state.templates.find(function(x){return x.status===status;});
      if(t){ t.subject=subject; t.heading=heading; t.body=body; t.enabled=enabled; }
      else { state.templates.push({status:status, subject:subject, heading:heading, body:body, enabled:enabled}); }
      toast((STATUS[status]?STATUS[status].label:status)+' notification saved', '', 'ok');

}

  void:     { label:'Void',     color:'#B03A3A', bg:'#F9E7E7' }
};
function gcPill(s){ var m=GC_STATUS[s]||{label:s,color:'#888',bg:'#eee'}; return '<span class="pill" style="background:'+m.bg+';color:'+m.color+'"><span class="pdot" style="background:'+m.color+'"></span>'+m.label+'</span>'; }

function giftAddr(c){
  return [c.ship_line1, c.ship_line2, [c.ship_city, c.ship_region, c.ship_postal].filter(Boolean).join(', ')]
    .filter(Boolean).join(', ');
}
// How the gift reaches its recipient: mailed physical card, emailed code, or a
// booth card sold in person (no delivery_method on the row).
function gcType(c){
  if(c.delivery_method==='card')  return { label:'By mail',   icon:I.truck };
  if(c.delivery_method==='email') return { label:'Email',     icon:I.mail };
  return { label:'In person', icon:I.bag };
}
function gcTypeChip(c){ var t=gcType(c); return '<span class="chip">'+t.icon+t.label+'</span>'; }

// Generate a code (admin RPC), then email the buyer a receipt (no code).
function generateGiftCard(btn){
  var emEl=document.querySelector('[data-gc-email]'), amEl=document.querySelector('[data-gc-amount]'), nmEl=document.querySelector('[data-gc-name]');
  var out=document.querySelector('[data-gc-result]');
  var email=(emEl&&emEl.value||'').trim();
  var amount=parseFloat((amEl&&amEl.value||'').replace(/[^0-9.]/g,''));
  var name=(nmEl&&nmEl.value||'').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter the buyer’s email','','err'); if(emEl)emEl.focus(); return; }
  if(!amount || amount<=0){ toast('Enter an amount','','err'); if(amEl)amEl.focus(); return; }
  btn.disabled=true; var orig=btn.textContent; btn.innerHTML='<span class="spin"></span>';
  sb.rpc('admin_generate_gift_card',{ p_amount:amount, p_buyer_email:email, p_buyer_name:name||null, p_note:null }).then(function(r){
    btn.disabled=false; btn.textContent=orig;
    if(r.error){ toast('Couldn’t generate', r.error.message,'err'); return; }
    var rec = Array.isArray(r.data)?r.data[0]:r.data;
    if(!rec||!rec.code){ toast('Couldn’t generate','No code returned','err'); return; }
    if(emEl)emEl.value=''; if(amEl)amEl.value=''; if(nmEl)nmEl.value='';
    if(out){
      out.innerHTML =
        '<div style="background:#FBF1F0;border:1px solid #F0D9D8;border-radius:14px;padding:16px 18px;text-align:center">'+
          '<div class="muted" style="font-size:12.5px;text-transform:uppercase;letter-spacing:1px">Write this on the card</div>'+
          '<div style="font-size:34px;font-weight:700;letter-spacing:4px;color:#B46869;margin:6px 0 4px">'+esc(rec.code)+'</div>'+
          '<div class="muted" style="font-size:13px">'+money(rec.amount)+' · receipt sent to '+esc(email)+'</div>'+
          '<button class="btn btn-line btn-sm" data-gc-copy="'+esc(rec.code)+'" style="margin-top:12px">Copy code</button>'+
        '</div>';
      var cp=out.querySelector('[data-gc-copy]');
      if(cp) cp.onclick=function(){ var v=cp.getAttribute('data-gc-copy'); if(navigator.clipboard){ navigator.clipboard.writeText(v).then(function(){ toast('Copied',v,'ok'); }); } };
    }
    toast('Gift card '+rec.code+' created', money(rec.amount),'ok');
    // Email the buyer a receipt (thank-you + amount, NO code) via send-order-email.
    var tpl=tplFor('gift_card');
    if(tpl && tpl.enabled!==false){
      var order={ customer_name:name||'there', email:email, gift_amount:rec.amount };
      var html=renderEmailHtml(tpl, order);
      sb.functions.invoke('send-order-email',{ body:{ to:email, subject:tpl.subject, html:html } }).then(function(rr){
        if(rr.error){ toast('Receipt not sent', rr.error.message||'','err'); return; }
        var d=rr.data||{}; if(d.error){ toast('Receipt not sent', d.error,'err'); return; }
        toast('Receipt sent','→ '+email,'ok');
      }).catch(function(e){ toast('Receipt not sent', String((e&&e.message)||e),'err'); });
    }
    // Optimistic: show the new card immediately (realtime will reconcile).
    state.giftCards.unshift(Object.assign({ status:'active', buyer_email:email, buyer_name:name||null, created_at:new Date().toISOString() }, rec, { amount:rec.amount }));
    render();
  });
}

/* ───────────────────────── users management ───────────────────────── */
// A simple admin allowlist — everyone here has the SAME full access. Invite a
// teammate by email (they get a link to set their own password); they show as
// "Invited" until they accept and sign in, then auto-flip to "Active". The
// bootstrap owner (ADMIN_EMAIL) is seeded server-side and can't be removed.

// Display name for the signed-in admin (their allowlist name, else email local-part).
function meName(){
  var me=((state.user&&state.user.email)||'').toLowerCase();
  var u=(state.adminUsers||[]).find(function(x){return (x.email||'').toLowerCase()===me;});
  if(u&&u.name) return u.name;
  var local=(me.split('@')[0]||'Admin');
  return local.charAt(0).toUpperCase()+local.slice(1);
}

function auPill(s){
  var m = s==='approved'
    ? { label:'Active',  color:'#2BA05A', bg:'#E7F6ED' }

  return '<span class="pill" style="background:'+m.bg+';color:'+m.color+'"><span class="pdot" style="background:'+m.color+'"></span>'+m.label+'</span>';
}

function viewUsers(){

      '<div class="panel-b">'+
        '<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">'+

            '<input class="input" data-au-name placeholder="First &amp; last"></div>'+
          '<button class="btn btn-sm" data-au-invite style="height:47px;padding:0 22px">Send invite</button>'+
        '</div>'+

      (isOwner ? '' : '<button class="ico danger" data-au-del="'+u.id+'" title="Remove access">'+I.trash+'</button>');
    return '<tr>'+
      '<td data-label="Name">'+avatar(u.name||u.email)+' <span style="vertical-align:middle">'+esc(u.name||'—')+
        (isMe?' <span class="muted">(you)</span>':'')+(isOwner?' <span class="muted">· owner</span>':'')+'</span></td>'+

// Invite a teammate: the invite-admin edge fn sends the Supabase invite email
// AND records the 'invited' allowlist row (service-role). Optimistic add here.
function inviteAdminUser(btn){
  var emEl=document.querySelector('[data-au-email]'), nmEl=document.querySelector('[data-au-name]');
  var email=(emEl&&emEl.value||'').trim().toLowerCase();
  var name=(nmEl&&nmEl.value||'').trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter a valid email','','err'); if(emEl)emEl.focus(); return; }
  if((state.adminUsers||[]).some(function(u){return (u.email||'').toLowerCase()===email;})){ toast('That person is already on the list','','err'); return; }
  btn.disabled=true; var orig=btn.textContent; btn.innerHTML='<span class="spin"></span>';
  sb.functions.invoke('invite-admin',{ body:{ email:email, name:name||null } }).then(function(r){
    btn.disabled=false; btn.textContent=orig;
    var d=(r&&r.data)||{};
    if(r.error || d.error){ toast('Couldn’t send invite', (d.error)||(r.error&&r.error.message)||'', 'err'); return; }
    if(emEl)emEl.value=''; if(nmEl)nmEl.value='';
    toast('Invite sent','→ '+email,'ok');
    if(!(state.adminUsers||[]).some(function(u){return (u.email||'').toLowerCase()===email;})){
      state.adminUsers.push({ id:'tmp-'+email, email:email, name:name||null, status:'invited', created_at:new Date().toISOString() });
    }
    render();
    refreshAdminUsers();   // reconcile with the real row
  }).catch(function(e){ btn.disabled=false; btn.textContent=orig; toast('Couldn’t send invite', String((e&&e.message)||e),'err'); });
}

function renameAdminUser(id){
  var u=(state.adminUsers||[]).find(function(x){return x.id===id;});
  if(!u) return;
  var name=window.prompt('Name for '+(u.email||'this teammate'), u.name||'');
  if(name===null) return;
  name=name.trim();
  var i=state.adminUsers.indexOf(u); if(i>=0) state.adminUsers[i]=Object.assign({},u,{name:name||null}); render();
  sb.from('admin_users').update({ name:name||null, updated_at:new Date().toISOString() }).eq('id',id).then(function(r){
    if(r.error){ toast('Couldn’t save', r.error.message,'err'); refreshAdminUsers(); return; }
    toast('Saved','','ok');
  });
}

function deleteAdminUser(id){
  var u=(state.adminUsers||[]).find(function(x){return x.id===id;});
  if(!u) return;
  if((u.email||'').toLowerCase()===ADMIN_EMAIL){ toast('You can’t remove the owner account','','err'); return; }
  if(!confirm('Remove '+(u.email||'this teammate')+'? They lose admin access immediately.')) return;
  state.adminUsers = state.adminUsers.filter(function(x){return x.id!==id;}); render();
  sb.from('admin_users').delete().eq('id',id).then(function(r){
    if(r.error){ toast('Couldn’t remove', r.error.message,'err'); refreshAdminUsers(); return; }
    toast('Access removed', u.email||'', 'ok');
  });
}

function voidGiftCard(id){
  var i=state.giftCards.findIndex(function(x){return x.id===id;});
  var prev=i>=0?Object.assign({},state.giftCards[i]):null;
  if(i>=0){ state.giftCards[i]=Object.assign({},state.giftCards[i],{status:'void'}); render(); }
  // Void either an active booth card or a pending online purchase that never paid.
  sb.from('gift_cards').update({status:'void'}).eq('id',id).in('status',['active','pending']).then(function(r){
    if(r.error){ if(prev&&i>=0){state.giftCards[i]=prev;} render(); toast('Couldn’t void', r.error.message,'err'); return; }
    toast('Gift card voided','','ok');
  });
}

// Release a pending online purchase once payment is confirmed: flip pending→active
// (guarded → one-shot), reveal the redeemable code, email the recipient (email
// delivery only) and always send the buyer a receipt. The code lives only on the
// returned row — never exposed to the public site.
function issueGiftCard(id){
  var i=state.giftCards.findIndex(function(x){return x.id===id;});
  if(i<0) return;
  var card=state.giftCards[i];
  var total=Number(card.amount||0)+Number(card.ship_fee||0);
  var isCard=card.delivery_method==='card';
  if(!confirm('Confirm you received '+money(total)+' for '+(card.purchase_ref||'this gift')+'?\n\nThis releases the code'+(isCard?' to write on the card':' and emails it to the recipient')+' and sends the buyer a receipt.')) return;
  var ts=new Date().toISOString();
  sb.from('gift_cards').update({status:'active', issued_at:ts}).eq('id',id).eq('status','pending').select().then(function(r){
    if(r.error){ toast('Couldn’t issue', r.error.message,'err'); return; }
    if(!r.data || !r.data.length){ toast('Already issued','That purchase was already issued or voided.','err'); refreshGiftCards(); return; }
    var full=r.data[0];   // includes the redeemable code
    state.giftCards[i]=full; render();
    toast('Gift issued', (full.purchase_ref||'')+' · '+money(full.amount),'ok');

    // Recipient email (email delivery only) — the one email that carries the code.
    if(!isCard && full.recipient_email){
      var rt=tplFor('gift_recipient');
      if(rt && rt.enabled!==false){
        var ro={ customer_name:full.recipient_name||'there', email:full.recipient_email,
          gift_amount:full.amount, gift_code:full.code, gift_from:full.buyer_name||'A friend',
          gift_recipient:full.recipient_name||'you', gift_message:full.gift_message||'' };
        sb.functions.invoke('send-order-email',{ body:{ to:full.recipient_email, subject:rt.subject, html:renderEmailHtml(rt, ro) } })
          .then(function(rr){ if(rr.error){ toast('Recipient email failed', rr.error.message||'','err'); } else { toast('Sent to recipient','→ '+full.recipient_email,'ok'); } })
          .catch(function(e){ toast('Recipient email failed', String((e&&e.message)||e),'err'); });
      }
    }
    // Physical card: surface the code + mailing address for Paige to write &
    // post, and drop a $0 shipping order into her queue so it flows through the
    // normal buy-label → tracking → completed pipeline (email gifts skip this).
    if(isCard){
      alert('Write this code on the card:\n\n    '+full.code+'\n\nMail to:\n'+(full.recipient_name||'')+'\n'+(giftAddr(full)||'(no address on file)'));
      sb.from('orders').insert({
        customer_name: full.recipient_name || 'Gift recipient',
        email: full.buyer_email || null,   // contact-present check; also who hears "shipped"
        fulfillment: 'shipping', ship_speed: 'standard',
        ship_to_name: full.recipient_name || null,
        address_line1: full.ship_line1 || null, address_line2: full.ship_line2 || null,
        city: full.ship_city || null, region: full.ship_region || null,
        postal_code: full.ship_postal || null, country: 'US',
        design_tier: 'classic', tier_price: 0, ship_fee: 0, rush_fee: 0,
        notes: 'Gift card '+full.code+' ('+money(full.amount)+') — write the code on the physical card and mail it to the recipient. Already paid; nothing to collect.',
        status: 'new', source: 'gift', gift_shipment_id: full.id
      }).select().then(function(orr){
        if(orr.error){ toast('Ship order not created', orr.error.message,'err'); return; }
        toast('Added to Orders to ship','Mail the gift card to '+(full.recipient_name||'the recipient'),'ok');
      });
    }
    // Buyer receipt — always, never contains the code.
    if(full.buyer_email){
      var bt=tplFor('gift_buyer_receipt');
      if(bt && bt.enabled!==false){
        var bo={ customer_name:full.buyer_name||'there', email:full.buyer_email,
          gift_amount:full.amount, gift_recipient:full.recipient_name||'your recipient' };
        sb.functions.invoke('send-order-email',{ body:{ to:full.buyer_email, subject:bt.subject, html:renderEmailHtml(bt, bo) } })
          .then(function(rr){ if(rr.error){ toast('Buyer receipt failed', rr.error.message||'','err'); } else { toast('Receipt sent to buyer','→ '+full.buyer_email,'ok'); } })
          .catch(function(e){ toast('Buyer receipt failed', String((e&&e.message)||e),'err'); });
      }
    }
  });
}

// Mark a card redeemed in person (used at the booth, no online order). The
// status='active' guard means it can only be burned once — same single-use
// guarantee as an online redemption, so it can never be used again.
function redeemGiftCard(id){
  var i=state.giftCards.findIndex(function(x){return x.id===id;});
  if(i<0) return;
  var card=state.giftCards[i];
  if(!confirm('Mark gift card '+card.code+' ('+money(card.amount)+') as redeemed? It can only be used once — this cannot be undone.')) return;
  var prev=Object.assign({},card);
  var ts=new Date().toISOString();
  state.giftCards[i]=Object.assign({},card,{status:'redeemed', redeemed_at:ts, redeemed_order_id:null});
  render();
  sb.from('gift_cards').update({status:'redeemed', redeemed_at:ts}).eq('id',id).eq('status','active').select().then(function(r){
    if(r.error){ state.giftCards[i]=prev; render(); toast('Couldn’t redeem', r.error.message,'err'); return; }
    if(!r.data || !r.data.length){ state.giftCards[i]=prev; render(); toast('Already used','That card was already redeemed or voided.','err'); return; }
    toast('Gift card redeemed', card.code+' · '+money(card.amount),'ok');
  });
}

// One home for the wording, on/off and cadence of every automatic customer email —

// open its editor. The editor cards are the same generic [data-nt] editor used

// Friendly, plain-English names + one-line descriptions for each template. The three
// groups drive both the list and the detail header.
var NT_GROUPS = [
  { title:'Order updates', hint:'The emails an order sends as it moves along.', items:[

      hint:'Sent when you tap “Mark payment collected” on an order. Confirms the money arrived and the set is officially in the queue (no promises about when you start).'},
    {s:'in_progress', name:'Set started'},

    {s:'cancelled',   name:'Order cancelled'}

  { title:'Gift emails', hint:'Sent around gift-card purchases.', items:[

/* ───────────────────────── customers (lightweight CRM) ───────────────────────── */
// Customers are DERIVED from orders — no customers table. A person "becomes a
// customer" when an order of theirs reaches Completed. Identity is a normalized
// key so the same person's orders group together across visits.
//
// Known limitation (self-heals): a legacy order with only a phone and a later
// order with an email land under two keys — both name and email have been
// required at checkout since 2026-07-25, so new orders always carry an email.
function custKey(o){
  var e = String(o.email||'').trim().toLowerCase();
  if(e) return 'e:'+e;
  var d = String(o.phone||'').replace(/\D/g,'');
  if(d.length===11 && d.charAt(0)==='1') d = d.slice(1);
  if(d) return 'p:'+d;
  return 'n:'+String(o.customer_name||'').trim().toLowerCase();
}
// completed_at is stamped by a DB trigger, but old completed rows may predate it.
function doneAt(o){ return new Date(o.completed_at || o.created_at).getTime(); }
// "Money verified" — the order's cash actually arrived. This is the ONLY basis
// for customer money math (LTV, avg order). Completed is deliberately NOT
// enough: completed means Paige finished the set — some customers pay later.
// Counts when:
//   · Paige flipped "Payment collected" in the order drawer, or
//   · a gift card fully prepaid the order (nothing was ever due).
// Cancelled orders never count.
function orderPaid(o){
  if(o.status==='cancelled') return false;
  if(o.payment_collected===true) return true;
  var v = orderValue(o);
  return v>0 && (v - Number(o.gift_credit||0)) <= 0;
}
// What's still owed on one order (order value minus any gift credit).
function orderDue(o){ return Math.max(0, orderValue(o) - Number(o.gift_credit||0)); }
// Most common value across orders; ties go to the most recent (arr is newest-first).
function custMode(arr, field){
  var counts={}, best=null, bestN=0;
  arr.forEach(function(o){ var v=o[field]; if(!v) return; counts[v]=(counts[v]||0)+1; if(counts[v]>bestN){ bestN=counts[v]; best=v; } });
  return best;
}
// Most recent non-empty value of a field across a newest-first order list.
function custField(orders, f){ for(var i=0;i<orders.length;i++){ var v=String(orders[i][f]||'').trim(); if(v) return v; } return ''; }

function buildCustomers(){
  var byKey = {};
  state.orders.forEach(function(o){
    if(o.source==='sample') return;   // Paige's test orders aren't customers
    if(o.gift_shipment_id) return;    // $0 "mail the gift card" task rows
    var k = custKey(o);
    var c = byKey[k]; if(!c){ c = byKey[k] = { key:k, orders:[], completed:[] }; }
    c.orders.push(o);
    if(o.status==='completed') c.completed.push(o);
  });
  var reengageDays = parseInt(state.settings.reengage_delay_days,10) || 30;
  var list = [];
  Object.keys(byKey).forEach(function(k){
    var c = byKey[k];
    // "Completed ⇒ customer": mid-pipeline or cancelled-only people stay in Orders.
    if(!c.completed.length){ delete byKey[k]; return; }
    c.orders.sort(function(a,b){ return new Date(b.created_at)-new Date(a.created_at); });
    c.completed.sort(function(a,b){ return doneAt(b)-doneAt(a); });
    var latest = c.orders[0];
    c.name  = latest.customer_name || '—';
    c.email = custField(c.orders,'email');
    c.phone = custField(c.orders,'phone');
    // Two bases, deliberately separate:
    //   active = every real (non-cancelled) order → order counts, dates, habits.
    //   paid   = money-verified orders (orderPaid) → ALL money math.
    // Completed only gates who appears here; it says nothing about money.
    c.active = c.orders.filter(function(o){ return o.status!=='cancelled'; });
    c.paid   = c.active.filter(orderPaid);
    c.n      = c.active.length;
    c.nPaid  = c.paid.length;
    c.completedN = c.completed.length;
    // Gross LTV over paid orders (set + ship + rush; gift credit not subtracted —
    // gift-card cash is tracked as its own stream on the Gift Cards panel).
    c.ltv = c.paid.reduce(function(s,o){ return s+orderValue(o); },0);
    // Money still owed: what's due on every real order not yet marked collected.
    c.outstanding = c.active.reduce(function(s,o){ return s + (orderPaid(o)?0:orderDue(o)); },0);
    c.aov = c.nPaid ? c.ltv/c.nPaid : 0;
    c.firstAt = new Date(c.active[c.active.length-1].created_at).getTime();
    c.lastAt  = new Date(c.active[0].created_at).getTime();
    c.daysSince = Math.max(0, Math.floor((Date.now()-c.lastAt)/864e5));
    c.avgGapDays = c.n>1 ? Math.round((c.lastAt-c.firstAt)/864e5/(c.n-1)) : null;
    c.hasOpen = c.orders.some(function(o){ return ['new','unpaid','in_progress','ready'].indexOf(o.status)>=0; });
    c.optedOut = c.email ? isOptedOut(c.email) : false;
    // Due = quiet past the reminder window AND actually reachable by the nudge
    // system (has an email, not opted out) AND not already mid-order.
    c.due = !!c.email && !c.optedOut && !c.hasOpen && c.daysSince >= reengageDays;
    c.favShape = custMode(c.active,'nail_shape');
    c.favTier  = custMode(c.active,'design_tier');
    c.fulfil   = custMode(c.active,'fulfillment');
    c.latest   = latest;
    list.push(c);
  });
  return { list:list, byKey:byKey };
}

var CUST_PILL = {
  repeat: { label:'Repeat',          color:'#7C5CDA', bg:'#EDEAFB' },
  due:    { label:'Due for reorder', color:'#C98A12', bg:'#FBF1DC' },
  fresh:  { label:'New',             color:'#3B7DD8', bg:'#EAF1FC' },
  unsub:  { label:'Unsubscribed',    color:'#8A7F87', bg:'#F0ECEF' }
};
function custPill(k){ var m=CUST_PILL[k]; return '<span class="pill" style="background:'+m.bg+';color:'+m.color+'"><span class="pdot" style="background:'+m.color+'"></span>'+m.label+'</span>'; }
function custPills(c){
  var p = c.n>=2 ? custPill('repeat') : custPill('fresh');
  if(c.due) p += ' '+custPill('due');

  if(c.hasOpen) p += ' <span class="chip" style="color:#0E9E8E" title="Has an order in progress">'+I.cart+'Active order</span>';

}

// Paired bars per calendar month: customers whose FIRST order landed that month
// (new) vs customers placing an order whose first was in an earlier month
// (returning). Order activity, not completion. Modeled on barChart()'s SVG.
function custMonthChart(list){
  var months=[], now=new Date();
  for(var i=5;i>=0;i--){ var d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push({y:d.getFullYear(), m:d.getMonth(), label:d.toLocaleDateString('en-US',{month:'short'}), nw:0, ret:0}); }
  function slot(t){ var x=new Date(t); for(var j=0;j<months.length;j++){ if(months[j].y===x.getFullYear()&&months[j].m===x.getMonth()) return months[j]; } return null; }
  list.forEach(function(c){
    var f=slot(c.firstAt); if(f) f.nw++;
    var seen={};
    c.active.forEach(function(o){
      var t=new Date(o.created_at).getTime(), x=new Date(t);
      if(c.firstAt >= new Date(x.getFullYear(), x.getMonth(), 1).getTime()) return; // first order was this month → not returning
      var k=x.getFullYear()+'-'+x.getMonth(); if(seen[k]) return; seen[k]=1;
      var m=slot(t); if(m) m.ret++;
    });
  });
  var max=1; months.forEach(function(m){ max=Math.max(max, m.nw, m.ret); });
  var W=640, H=180, pad=8, gw=(W-pad*2)/months.length, bw=Math.min(34,(gw-18)/2);
  var bars='', labels='', gl='';
  for(var g=1;g<=3;g++){ var gy=pad+(H-pad*2)*(g/4); gl+='<line x1="0" y1="'+gy.toFixed(1)+'" x2="'+W+'" y2="'+gy.toFixed(1)+'" stroke="rgba(95,70,63,0.07)" stroke-width="1"/>'; }
  months.forEach(function(m,idx){
    var cx=pad+idx*gw+gw/2;
    var h1=(H-pad*2)*(m.nw/max), h2=(H-pad*2)*(m.ret/max);
    bars+='<rect x="'+(cx-bw-2).toFixed(1)+'" y="'+(H-pad-Math.max(h1,m.nw?3:0)).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h1,m.nw?3:0).toFixed(1)+'" rx="4" fill="url(#bgc1)"><title>'+m.label+': '+m.nw+' new customer'+(m.nw===1?'':'s')+'</title></rect>';
    bars+='<rect x="'+(cx+2).toFixed(1)+'" y="'+(H-pad-Math.max(h2,m.ret?3:0)).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h2,m.ret?3:0).toFixed(1)+'" rx="4" fill="#E8B6BA"><title>'+m.label+': '+m.ret+' returning</title></rect>';
    labels+='<text x="'+cx.toFixed(1)+'" y="'+(H+13)+'" text-anchor="middle" font-size="9.5" fill="rgba(95,70,63,0.5)">'+m.label+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+(H+18)+'" width="100%" preserveAspectRatio="none" style="display:block">'+
    '<defs><linearGradient id="bgc1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DC8289"/><stop offset="1" stop-color="#B46869"/></linearGradient></defs>'+
    gl+bars+labels+'</svg>';
}

    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">'+custPills(c)+'</div></div></div>';

  return '<div class="view">'+
    '<button class="nt-back" data-cust-back>'+I.chev+'All customers</button>'+
    head + kpis +
    '<div class="grid-2">'+
      '<div class="panel"><div class="panel-h"><div class="panel-t">Contact</div></div>'+
        '<div class="panel-b"><div class="dr-card">'+contact+'</div>'+
        '<div style="margin-top:14px"><div class="dr-sec-t">Sizes on file</div>'+sizesHtml+'</div></div></div>'+
      '<div class="panel"><div class="panel-h"><div class="panel-t">Marketing<small>Reminder emails for this customer</small></div></div>'+
        '<div class="panel-b"><div class="dr-card">'+mk+'</div></div></div>'+
    '</div>'+
    notesPanel+
    '<div class="panel"><div class="panel-h"><div class="panel-t">Order history<small>'+c.orders.length+' order'+(c.orders.length===1?'':'s')+' · tap one to open it</small></div></div>'+
      '<div class="panel-b" style="padding:0 0 4px"><table class="tbl"><thead><tr>'+
        '<th>Order</th><th>Date</th><th class="hide-sm">Design</th><th>Total</th><th>Status</th>'+
      '</tr></thead><tbody>'+histRows+'</tbody></table></div></div>'+
  '</div>';
}

function saveCustomerNote(btn){
  var key = btn.getAttribute('data-cust-note-save');
  var ta = document.querySelector('[data-cust-note]');
  var notes = ta ? ta.value.trim() : '';
  btn.disabled = true; var orig = btn.textContent; btn.innerHTML = '<span class="spin"></span>';
  sb.from('customer_notes').upsert({ key:key, notes:notes, updated_at:new Date().toISOString() }, { onConflict:'key' }).then(function(r){
    btn.disabled = false; btn.textContent = orig;
    if(r.error){ toast('Couldn’t save note', r.error.message, 'err'); return; }
    state.custNotes[key] = notes;
    toast('Note saved', '', 'ok');
  });
}

// focusSec: optional accordion id (e.g. 'sec-pay') to open expanded — stays open
// across re-renders until the drawer closes or another order opens.
function openOrder(id, focusSec){
  state.drawerId = id;
  state.drawerFocus = focusSec || null;
  if(state.shipDraft && state.shipDraft.id!==id) state.shipDraft=null; // drop a stale draft from another order
  var o = state.orders.find(function(x){return x.id===id;});
  if(o && !o.admin_seen){ markSeen([id]); }
  renderDrawer();
  if(focusSec){ var sec=document.getElementById(focusSec); if(sec) sec.scrollIntoView({block:'nearest'}); }
  if(o && !state.photos[id]) loadPhotos(id);
}
function closeDrawer(){ state.drawerId=null; state.drawerFocus=null; state.giftDrawerId=null; state.shipDraft=null; renderDrawer(); }
